<title>Mybody 패치노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
  :root {
    --bg: #f6f6fb;
    --surface: #ffffff;
    --surface-2: #eeeef8;
    --ink: #1c1c2e;
    --ink-2: #55556b;
    --ink-3: #8a8aa3;
    --line: #dcdcec;
    --accent: #4f46e5;
    --accent-ink: #ffffff;
    --accent-soft: #e6e5fb;
    --fat: #d9652f;
    --muscle: #2f7be8;
    --ok: #2e9e5b;
    --ok-soft: #e1f3e8;
    --warn: #b8860b;
    --warn-soft: #fbf1d3;
    --shadow: 0 1px 2px rgba(28, 28, 46, .06), 0 8px 24px rgba(28, 28, 46, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121220;
      --surface: #1b1b2c;
      --surface-2: #24243a;
      --ink: #ececf6;
      --ink-2: #b4b4cc;
      --ink-3: #7e7e9a;
      --line: #33334d;
      --accent: #8b87ff;
      --accent-ink: #0f0f1e;
      --accent-soft: #2a2856;
      --fat: #f08a55;
      --muscle: #6aa3ff;
      --ok: #57c584;
      --ok-soft: #1c3a2a;
      --warn: #e2b53d;
      --warn-soft: #3a3116;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121220;
    --surface: #1b1b2c;
    --surface-2: #24243a;
    --ink: #ececf6;
    --ink-2: #b4b4cc;
    --ink-3: #7e7e9a;
    --line: #33334d;
    --accent: #8b87ff;
    --accent-ink: #0f0f1e;
    --accent-soft: #2a2856;
    --fat: #f08a55;
    --muscle: #6aa3ff;
    --ok: #57c584;
    --ok-soft: #1c3a2a;
    --warn: #e2b53d;
    --warn-soft: #3a3116;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 28px 64px;
  }

  /* --- 머리 ------------------------------------------------------------ */
  header.top { display: grid; gap: 14px; margin-bottom: 26px; }
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-3);
  }
  h1 {
    margin: 0;
    font-family: "Gowun Batang", "Nanum Myeongjo", serif;
    font-weight: 700;
    font-size: clamp(30px, 6vw, 40px);
    line-height: 1.15;
    text-wrap: balance;
  }
  .lede { margin: 0; color: var(--ink-2); max-width: 60ch; }

  .latest {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: baseline;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; box-shadow: var(--shadow);
  }
  .latest .k { color: var(--ink-3); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
  .latest .v { font-variant-numeric: tabular-nums; }
  .latest .v strong { font-family: "Gowun Batang", serif; font-size: 22px; }

  /* --- 걸러 보기 -------------------------------------------------------- */
  .tools { display: grid; gap: 10px; margin-bottom: 26px; }
  .search {
    width: 100%; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .versions { display: flex; flex-wrap: wrap; gap: 6px; }
  .versions a {
    font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2);
    text-decoration: none; border-bottom: 1px dotted var(--line); padding: 2px 1px;
  }
  .versions a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* --- 판 하나 --------------------------------------------------------- */
  .release { display: grid; grid-template-columns: 112px 1fr; gap: 0 22px; padding-block: 26px; border-top: 1px solid var(--line); }
  .release .rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; padding-top: 4px; }
  .release .num {
    font-family: "Gowun Batang", serif; font-weight: 700; font-size: 26px; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  }
  .release .meta { margin-top: 8px; display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .release h2 { margin: 0 0 8px; font-size: 19px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
  .release .intro { margin: 0 0 14px; color: var(--ink-2); }
  .badge {
    display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: .03em;
    border-radius: 999px; padding: 2px 9px; vertical-align: middle;
  }
  .badge.now { background: var(--ok-soft); color: var(--ok); }
  .badge.soon { background: var(--warn-soft); color: var(--warn); }
  .badge.first { background: var(--accent-soft); color: var(--accent); }

  ul.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  ul.items li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: start; }
  .area {
    font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-align: center;
    border-radius: 6px; padding: 3px 0; margin-top: 3px;
    background: var(--surface-2); color: var(--ink-2);
  }
  .area[data-a="운동"] { color: var(--muscle); }
  .area[data-a="식단"] { color: var(--fat); }
  .area[data-a="버그"] { color: var(--warn); }
  .area[data-a="친구"] { color: var(--ok); }
  li p { margin: 0; }
  li p b { font-weight: 600; }
  .known { margin-top: 14px; padding: 10px 14px; border-left: 3px solid var(--line); color: var(--ink-2); font-size: 14px; }
  .known b { color: var(--ink); font-weight: 600; }
  .empty { color: var(--ink-3); padding-block: 24px; }

  footer { margin-top: 32px; color: var(--ink-3); font-size: 12.5px; }

  @media (max-width: 560px) {
    .release { grid-template-columns: 1fr; gap: 10px; }
    .release .rail { position: static; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
    .release .meta { margin-top: 0; display: flex; flex-wrap: wrap; gap: 0 10px; }
    ul.items li { grid-template-columns: 48px 1fr; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .chip, .versions a { transition: color .15s, background-color .15s; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Mybody · 내부 테스터용</div>
    <h1>Mybody 패치노트</h1>
    <p class="lede">판마다 무엇이 바뀌었는지 한 곳에 모아 둡니다. 새 판이 나올 때마다 여기에 더해집니다. 플레이 내부 테스트와 TestFlight 에 같은 판이 올라갑니다.</p>
    <div class="latest" id="latest"></div>
  </header>

  <section class="tools" aria-label="걸러 보기">
    <input class="search" id="q" type="search" placeholder="내용으로 찾기 (예: 루틴, 키보드, 뭘 먹을까)" aria-label="패치 내용 찾기">
    <div class="chips" id="areas" role="group" aria-label="영역"></div>
    <nav class="versions" id="vnav" aria-label="판 바로가기"></nav>
  </section>

  <main id="list"></main>

  <footer>빌드 번호는 저장소 커밋 수이고, 판 번호는 스토어에 보이는 번호입니다. 스토어에 나가는 판은 따로 표시합니다.</footer>
</div>

<script>

  const RELEASES = [

        ['친구', '알림 본문은 일반 문구만(이름 · 숫자는 앱에서). 로그인한 뒤에만 기기를 등록하고 로그아웃하면 지움.'],
        ['앱', '앱 알림을 켠 사람에게는 크롬 웹 알림을 보내지 않음. 설정에 「크롬(웹) 알림 끄기」.'],
        ['앱', '앱으로 돌아올 때마다 새 독촉 확인, 같은 독촉이 두 번 뜨지 않게.'],
      ],
      known: '이 판은 Firebase 설정 없이 빌드돼 앱 알림이 꺼진 채입니다. Firebase 설정(주인의 Google · Apple 로그인)이 끝나면 그 설정이 들어간 다음 판부터 켜집니다. 그 전에는 앱을 열거나 돌아올 때 독촉을 가져옵니다.',
    },
    {
      v: '0.2.14', build: 294, date: '2026-09-26', status: 'now',

      title: '아이폰 키보드 버그 · 친구 기본 공유값 · 스포츠 기록',
      intro: '아이폰 TestFlight 에서 찾은 버그(첫 설정의 키·나이 입력에서 키보드가 안 사라져 「확인」을 못 누름)를 근본부터 고칩니다.',
      items: [

        ['버그', '입력이 있는 화면 전부를 아이폰 키보드 높이로 검사해 가려지는 버튼을 고칩니다 — 설정 「내 몸 정보」 시트 · 식단 양 시트(잘림) · 운동 종료 시트. 설정 시트의 활동량 목록이 360 폭에서 옆으로 넘치던 것도.'],

  const AREAS = ['운동', '식단', '플랜', '추이', '친구', '홈', '설정', '앱', '버그'];
  const STATUS = { now: '내부 테스트 중', soon: '준비 중', first: '초기' };

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const idOf = r => 'v' + r.v.replace(/[^0-9a-z]+/gi, '-');

  let area = null;
  let query = '';

  function render() {
    const q = query.trim().toLowerCase();
    const list = document.getElementById('list');
    let html = '';
    let shown = 0;
    for (const r of RELEASES) {
      const items = r.items.filter(([a, t]) =>
        (!area || a === area) && (!q || t.replace(/<[^>]+>/g, '').toLowerCase().includes(q) || r.title.toLowerCase().includes(q)));
      if (!items.length) continue;
      shown++;
      const badge = r.status === 'soon' ? 'soon' : (r.status === 'first' ? 'first' : 'now');
      html += `<article class="release" id="${idOf(r)}">
        <div class="rail">
          <div class="num">${esc(r.v)}</div>
          <div class="meta">
            ${r.build ? `<span>빌드 ${r.build}</span>` : ''}
            <span>${esc(r.date)}</span>
            <span>${esc(r.channels)}</span>
          </div>
        </div>
        <div>
          <h2>${esc(r.title)} <span class="badge ${badge}">${STATUS[r.status]}</span></h2>
          ${r.intro ? `<p class="intro">${esc(r.intro)}</p>` : ''}
          <ul class="items">
            ${items.map(([a, t]) => `<li><span class="area" data-a="${a}">${a}</span><p>${t}</p></li>`).join('')}
          </ul>
          ${r.known ? `<div class="known"><b>알려진 것</b> · ${esc(r.known)}</div>` : ''}
        </div>
      </article>`;
    }
    list.innerHTML = html || '<p class="empty">맞는 항목이 없습니다.</p>';
  }

  function renderChips() {
    const box = document.getElementById('areas');
    box.innerHTML = ['전체', ...AREAS].map(a =>
      `<button type="button" class="chip" data-area="${a === '전체' ? '' : a}" aria-pressed="${(a === '전체' && !area) || a === area}">${a}</button>`).join('');
    box.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      area = b.dataset.area || null;
      renderChips();
      render();
    }));
  }

  function renderNav() {
    document.getElementById('vnav').innerHTML = RELEASES.map(r => `<a href="#${idOf(r)}">${esc(r.v)}</a>`).join('');
  }

  function renderLatest() {
    const cur = RELEASES.find(r => r.status === 'now');
    const next = RELEASES.find(r => r.status === 'soon');
    document.getElementById('latest').innerHTML = `
      <span class="k">지금 받는 판</span><span class="v"><strong>${esc(cur.v)}</strong> · 빌드 ${cur.build} · ${esc(cur.date)}</span>
      <span class="k">받는 곳</span><span class="v">${esc(cur.channels)}</span>
      ${next ? `<span class="k">다음 판</span><span class="v">${esc(next.v)} — ${esc(next.title)}</span>` : ''}`;
  }

  document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
  renderLatest();
  renderChips();
  renderNav();
  render();
</script>
