# =============================================================================
# 출처 링크 점검 — 앱 안 「출처」 링크(app/lib/src/citations.dart)가 실제로 열리고
# 우리가 적은 논문 · 지침을 가리키는지 봅니다(애플 1.4.1 재심사 전).
#
# 클라우드 작업 환경은 출판사 · 정부 사이트(doi.org · pubmed · mohw.go.kr …)가 막혀 있어서
# GitHub 러너에서 돌립니다. 로그의 줄마다 「우리 서지」 와 「실제 링크」(DOI 는 Crossref 기록,
# 나머지는 페이지 제목)가 나란히 찍힙니다 — 둘이 같은 글인지 눈으로 봅니다.
#
# 실패한 링크가 있어도 작업은 초록으로 끝납니다(빨간 불 메일이 주인에게 가지 않게) —
# 결과는 로그 끝의 「N개 중 실패 M개」 줄로 봅니다.
# =============================================================================
name: 출처 링크 점검

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 링크 열어 보기
        run: node tools/check-citations.js --meta || true
