# =============================================================================
# 친구들에게 줄 앱 만들기
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# 그러면 앱을 만들어서 **Releases** 에 올립니다.
#
# 왜 Actions 의 Artifacts 로는 안 되는가: 그건 **깃허브에 로그인한 사람만**
# 받을 수 있습니다. 친구들한테는 깃허브 계정이 없습니다. Releases 에 올린
# 파일은 로그인 없이 누구나 주소만으로 받습니다. 친구한테 보낼 게 그
# 주소 하나면 됩니다.
# =============================================================================
name: 친구들에게 줄 앱

on:
  push:
    tags: ['v*']

  # 태그를 안 밀고 Actions 탭에서 눌러서도 낼 수 있습니다.
  # (태그는 gh 가 지금 커밋 자리에 알아서 만들어 줍니다.)
  workflow_dispatch:
    inputs:
      version:
        description: '판 번호 (예: v0.2.0)'
        required: true

permissions:
  contents: read

jobs:
  # 앱 만들기는 apk.yml 을 그대로 불러 씁니다. 베껴 두면 한쪽만 고치게 됩니다.
  build:
    uses: ./.github/workflows/apk.yml
    # **이게 없으면 서명 열쇠가 안 넘어갑니다.**
    #
    # 불러 쓰는 워크플로는 비밀값을 물려받지 않습니다. 따로 넘겨 주지
    # 않으면 열쇠를 꺼내는 단계가 조용히 건너뛰어지고, **디버그 열쇠로
    # 서명된 앱이 배포로 나갑니다.** 빌드는 끝까지 초록입니다.
    #
    # 실제로 그랬습니다 — 열쇠를 넣어 둔 상태에서 낸 첫 배포가 디버그
    # 서명이었고, 지문을 찍어 두지 않았으면 친구 폰에서 업데이트가
    # 거부될 때까지 몰랐을 겁니다.
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # Releases 에 올리는 데만 씁니다
    steps:
      - uses: actions/checkout@v4

      - name: 판 번호 정하기
        id: v
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # **디버그 열쇠로 서명된 것은 배포로 내보내지 않습니다.**
      #
      # 친구들한테 한 번 나간 앱은 되돌릴 수 없습니다. 디버그 열쇠로
      # 나가면 다음 판이 업데이트로 안 깔리고, 지웠다 깔면 그 폰의
      # 기록이 사라집니다. 조용히 넘어가느니 여기서 멈춥니다.
      - name: 내 열쇠로 서명됐는지
        run: |
          if [ "${{ needs.build.outputs.signed }}" != "yes" ]; then
            echo "디버그 열쇠로 서명됐습니다 — 배포를 멈춥니다."
            echo "Secrets 에 ANDROID_KEYSTORE_BASE64 등 네 개가 있는지,"
            echo "release.yml 의 build 잡에 secrets: inherit 가 있는지 보세요."
            exit 1
          fi
          echo "내 열쇠로 서명됐습니다."

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: apk

      # 파일 이름에 판 번호를 넣습니다. 친구 폰의 받은 파일 목록에
      # app-release.apk 가 여러 개 쌓이면 어느 게 새 것인지 모릅니다.
      - name: 이름 붙이기
        id: apk
        run: |
          tag="${{ steps.v.outputs.tag }}"
          out="mybody-${tag}.apk"
          src=$(find apk -name '*.apk' | head -1)
          if [ -z "$src" ]; then echo "APK 를 못 찾았습니다"; ls -R apk; exit 1; fi
          mv "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$out" | cut -f1)" >> "$GITHUB_OUTPUT"
          # 플레이 스토어용 묶음(.aab)도 같이 올립니다 — 주인이 Actions 를
          # 뒤지지 않고 이 페이지에서 바로 받아 콘솔에 올리도록. 폰에는
          # 안 깔리는 파일이라 안내문에 그렇게 적습니다.
          aab=$(find apk -name '*.aab' | head -1)
          if [ -n "$aab" ]; then
            outb="mybody-${tag}-playstore.aab"
            mv "$aab" "$outb"
            echo "aab=$outb" >> "$GITHUB_OUTPUT"
          fi

      # 서명 지문을 적어 둡니다. 친구가 "업데이트가 안 깔려요" 할 때
      # 어느 판부터 열쇠가 바뀌었는지 여기서 바로 보입니다.
      - name: 서명 지문
        id: sign
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$signer" ]; then
            fp=$("$signer" verify --print-certs "${{ steps.apk.outputs.file }}" \
                 | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: *//')
          else
            fp="(못 쟀습니다)"
          fi
          echo "fp=$fp" >> "$GITHUB_OUTPUT"

      # 이 글이 친구들이 보는 페이지입니다. 링크 하나만 보내면 됩니다.
      - name: 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          아래 **mybody-...apk** 를 눌러서 받고, 받은 파일을 누르면 깔립니다.
          (`...-playstore.aab` 는 구글 플레이에 올리는 개발자용 파일입니다 — 폰에는 안 깔립니다.)

          ## 깔 때 나오는 경고

          "출처를 알 수 없는 앱" 이라고 물어봅니다. **허용**을 눌러 주세요.
          구글 플레이를 안 거쳐서 그렇습니다. 폰이 한 번 더 물어보면
          "무시하고 설치" 를 누르면 됩니다.

          ## 처음 켜면

          1. 키·나이·성별을 넣습니다 (계산에 필요합니다)
          2. 인바디 결과지의 숫자 세 개 — 체중 · 골격근량 · 체지방률 — 를 넣습니다
             (사진을 붙이고 「사진에서 읽기」를 누르면 알아서 채웁니다)
          3. 목표를 정하면 **언제 달성되는지**와 그때까지의 운동·식단이 나옵니다

          서버 주소는 앱에 들어 있습니다 — 켜면 바로 연결됩니다.

          ## 알아 두실 것

          - 처음 켜면 **로그인/가입**이 먼저입니다. 결과지 사진 판독과 친구
            기능이 계정으로 되기 때문입니다.
          - **기록은 이 폰과 내 계정에 저장됩니다.** 폰을 바꿔서 로그인하면
            측정·목표·계획·식단이 그대로 따라옵니다. 사진만 폰에 남습니다.
          - 친구가 보는 것은 **내가 보여 주기로 켠 것**뿐입니다(친구 → 친구
            상세 → 「내가 이 친구에게 보여 주는 것」).

          ## 안 깔릴 때

          "패키지가 기존 패키지와 충돌합니다" 가 나오면, 예전에 깐 것을 지우고
          다시 깔아야 합니다. 로그인해 둔 계정이면 기록은 서버에서 돌아옵니다.
          NOTES

          {
            echo ""
            echo "---"
            echo "크기 ${{ steps.apk.outputs.size }} · 서명 지문 \`${{ steps.sign.outputs.fp }}\`"
          } >> notes.md

          files="${{ steps.apk.outputs.file }}"
          if [ -n "${{ steps.apk.outputs.aab }}" ]; then files="$files ${{ steps.apk.outputs.aab }}"; fi
          gh release create "${{ steps.v.outputs.tag }}" $files \
            --title "Mybody ${{ steps.v.outputs.tag }}" \
            --notes-file notes.md \
            --repo "$GITHUB_REPOSITORY"

          echo "### 친구들한테 보낼 주소" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/${{ steps.v.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
