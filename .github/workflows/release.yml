# =============================================================================
# 친구들에게 줄 앱 만들기
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# 그러면 앱을 만들어서 **Releases** 에 올립니다.
#
# 왜 Actions 의 Artifacts 로는 안 되는가: 그건 **깃허브에 로그인한 사람만**
# 받을 수 있습니다. 친구들한테는 깃허브 계정이 없습니다. Releases 에 올린
# 파일은 로그인 없이 누구나 주소만으로 받습니다. 친구한테 보낼 게 그
# 주소 하나면 됩니다.
# =============================================================================
name: 친구들에게 줄 앱

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # 앱 만들기는 apk.yml 을 그대로 불러 씁니다. 베껴 두면 한쪽만 고치게 됩니다.
  build:
    uses: ./.github/workflows/apk.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Releases 에 올리는 데만 씁니다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: apk

      # 파일 이름에 판 번호를 넣습니다. 친구 폰의 받은 파일 목록에
      # app-release.apk 가 여러 개 쌓이면 어느 게 새 것인지 모릅니다.
      - name: 이름 붙이기
        id: apk
        run: |
          tag="${GITHUB_REF_NAME}"
          out="mybody-${tag}.apk"
          src=$(find apk -name '*.apk' | head -1)
          if [ -z "$src" ]; then echo "APK 를 못 찾았습니다"; ls -R apk; exit 1; fi
          mv "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$out" | cut -f1)" >> "$GITHUB_OUTPUT"

      # 서명 지문을 적어 둡니다. 친구가 "업데이트가 안 깔려요" 할 때
      # 어느 판부터 열쇠가 바뀌었는지 여기서 바로 보입니다.
      - name: 서명 지문
        id: sign
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$signer" ]; then
            fp=$("$signer" verify --print-certs "${{ steps.apk.outputs.file }}" \
                 | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: *//')
          else
            fp="(못 쟀습니다)"
          fi
          echo "fp=$fp" >> "$GITHUB_OUTPUT"

      # 이 글이 친구들이 보는 페이지입니다. 링크 하나만 보내면 됩니다.
      - name: 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          아래 **mybody-...apk** 를 눌러서 받고, 받은 파일을 누르면 깔립니다.

          ## 깔 때 나오는 경고

          "출처를 알 수 없는 앱" 이라고 물어봅니다. **허용**을 눌러 주세요.
          구글 플레이를 안 거쳐서 그렇습니다. 폰이 한 번 더 물어보면
          "무시하고 설치" 를 누르면 됩니다.

          ## 처음 켜면

          1. 키·나이·성별을 넣습니다 (계산에 필요합니다)
          2. 인바디 결과지의 숫자 세 개 — 체중 · 골격근량 · 체지방량 — 를 넣습니다
          3. 목표를 정하면 **언제 달성되는지**와 그때까지의 운동·식단이 나옵니다

          친구 기능을 쓰려면 **설정 → 서버 주소**에 받으신 주소를 넣으세요.
          안 넣어도 나머지는 전부 됩니다.

          ## 알아 두실 것

          - **몸 숫자는 이 폰에만 있습니다.** 서버로 안 올라갑니다.
            친구 기능을 켜면 주간 요약(체중·골격근·체지방과 변화량)만 올라갑니다.
          - 그래서 **앱을 지우면 기록도 같이 지워집니다.** 폰을 바꾸시기 전에
            설정 → 내보내기로 파일 하나 저장해 두세요.

          ## 안 깔릴 때

          "패키지가 기존 패키지와 충돌합니다" 가 나오면, 예전에 깐 것을 지우고
          다시 깔아야 합니다. **지우기 전에 설정 → 내보내기를 먼저 하세요.**
          NOTES

          {
            echo ""
            echo "---"
            echo "크기 ${{ steps.apk.outputs.size }} · 서명 지문 \`${{ steps.sign.outputs.fp }}\`"
          } >> notes.md

          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --title "Mybody $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --repo "$GITHUB_REPOSITORY"

          echo "### 친구들한테 보낼 주소" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
