# =============================================================================
# 앱 파일(APK) 만들기
#
# 이 저장소에 코드를 올리면 깃허브 컴퓨터가 안드로이드 앱 파일을 만들어
# 둡니다. 만들어진 파일은 Actions 탭 → 맨 위 실행 → 아래 "Artifacts" 에서
# 받을 수 있습니다. 받아서 폰에 넣으면 깔립니다.
#
# 왜 여기서 만드나: 개발하는 곳에 안드로이드 SDK 가 없습니다. 깃허브
# 기계에는 이미 깔려 있고, 이 저장소는 공개라 빌드 시간이 공짜입니다.
# =============================================================================
name: 앱 파일(APK) 만들기

on:
  push:
    branches: [claude/body-management-app-prototype-m4mv4k]
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/apk.yml'
      # 설정 검사(tools/test-android.js)가 이 빌드의 첫 단계입니다 — 그 파일이
      # 바뀌면 빌드도 돌아야 고친 검사가 맞는지 압니다.
      - 'tools/test-android.js'
      # 설명서만 고쳤을 때는 다시 안 만듭니다 — app/README.md 가 위의
      # app/** 에 걸려서 실제로 한 번 헛돌았습니다.
      - '!app/**/*.md'
  workflow_dispatch:      # Actions 탭에서 손으로도 돌릴 수 있습니다

  # 배포용 워크플로(release.yml)가 이 빌드를 그대로 불러 씁니다.
  # 빌드 과정을 두 벌로 베껴 두면 한쪽만 고치는 날이 옵니다.
  workflow_call:
    # 배포(release.yml)를 Actions 탭에서 눌러 낼 때는 태그로 불리지 않아서
    # GITHUB_REF_NAME 이 가지 이름입니다. 그러면 판 이름이 pubspec 으로
    # 떨어져, 릴리스 이름(v0.2.8)과 앱 안의 판이 어긋날 수 있습니다. 앱은
    # 그 판으로 새 판 안내를 정하므로(update.dart) 어긋나면 이미 최신인
    # 사람에게 "새 버전이 나왔습니다" 가 뜹니다. 그래서 판을 받아 씁니다.
    inputs:
      version:
        description: '판 번호 (예: v0.2.8). 비우면 태그 · pubspec 에서'
        type: string
        required: false
        default: ''
    outputs:
      artifact:
        description: 만들어진 APK 가 담긴 꾸러미 이름
        value: ${{ jobs.apk.outputs.artifact }}
      signed:
        description: 내 서명 열쇠로 서명했으면 yes
        value: ${{ jobs.apk.outputs.signed }}
      push:
        description: 앱 알림(FCM) 설정을 넣어 만들었으면 yes
        value: ${{ jobs.apk.outputs.push }}

# 연달아 올리면 앞의 빌드는 그만둡니다. 어차피 마지막 것만 씁니다.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read          # 코드를 읽는 것 말고는 아무 권한도 주지 않습니다

env:
  # 여기서 쓰던 것과 **같은 판**을 씁니다. 안 박아 두면 깃허브가 그때그때
  # 최신 Flutter 를 쓰게 되고, 여기서 통과한 시험과 다른 것이 빌드됩니다.
  FLUTTER_VERSION: 3.41.2

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
      signed: ${{ steps.key.outputs.signed }}
      push: ${{ steps.fcm.outputs.on }}

    env:
      # `secrets` 는 step 의 `if:` 안에서 못 씁니다 — 그 문맥에 없습니다.
      # (쓰면 "Unrecognized named-value: 'secrets'" 로 빌드가 시작도 못 합니다.)
      # 잡 env 에서는 쓸 수 있으니 여기서 한 번 받아 두고, 아래에서는
      # env 를 봅니다.
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 판 번호를 커밋 수로 매기려면 역사가 다 있어야 합니다 — 얕은
          # 클론이면 커밋 수가 언제나 1 입니다. 아래 「판 번호」 단계 참고.
          fetch-depth: 0

      # **versionCode 는 커밋 수입니다.**
      #
      # 전에는 실행 번호(run_number)였는데, 그 번호가 **두 갈래**였습니다 —
      # 푸시 빌드는 이 파일의 실행 번호(40번대)를, 배포(release.yml)는
      # 그쪽 실행 번호(v0.2.2 = 8)를 받았습니다. 같은 코드가 어느 길로
      # 빌드됐느냐에 따라 번호가 달라서, 플레이에 푸시 빌드(40)를 한 번
      # 올리고 나면 다음 배포(9)는 "번호가 작다" 고 거부됩니다. 커밋 수는
      # 길이 하나고 커밋마다 커집니다. 친구 폰의 8 보다는 이미 큽니다.
      - name: 판 번호(versionCode)
        id: vc
        env:
          # 받은 값은 셸에 바로 넣지 않고 환경변수로 건넵니다(글자 그대로).
          VERSION_IN: ${{ inputs.version }}
        run: |
          n=$(git rev-list --count HEAD)
          echo "code=$n" >> "$GITHUB_OUTPUT"
          echo "versionCode $n"
          # 판 이름: 배포가 넘겨 준 판(v1.2.3) → 태그 → pubspec.yaml 순서.
          # v0.2.4 태그가 pubspec 의 0.2.3 으로 나간 적이 있습니다.
          ref="${VERSION_IN:-}"
          if [ -z "$ref" ]; then ref="${GITHUB_REF_NAME:-}"; fi
          if [[ "$ref" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then name="${BASH_REMATCH[1]}"
          else name=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' app/pubspec.yaml); fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionName $name"

      # AGP 8.11 / Gradle 8.14 가 도는 자바입니다. 기계 기본값은 그때그때
      # 달라지므로 **손으로 고릅니다.**
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 는 남의 액션을 쓰지 않고 직접 받습니다 — 이 저장소가
      # 믿어야 할 바깥 것을 하나라도 줄이려고 그렇게 합니다.
      - name: Flutter 캐시
        id: fcache
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}

      - name: Flutter 받기
        if: steps.fcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$HOME/flutter"

      - name: Flutter 를 길에 올리기
        run: |
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"

      - run: flutter --version

      # 서명 열쇠가 Secrets 에 있으면 꺼내 씁니다. 없으면 이 단계는 통째로
      # 건너뛰고 디버그 열쇠로 서명됩니다 (맨 아래 안내를 보세요).
      - name: 서명 열쇠 꺼내기
        id: key
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KS" | base64 -d > app/android/mybody.jks
          {
            echo "storeFile=mybody.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PW"
          } > app/android/key.properties
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      # **앱 알림(FCM) 설정 파일을 비밀에서 꺼냅니다.**
      #
      # 저장소가 공개라 google-services.json 은 커밋하지 않습니다(.gitignore). 그래서
      # 비밀(FIREBASE_ANDROID_JSON_B64)에 base64 로 넣어 두고 여기서 파일로 풉니다.
      # 비밀이 없거나 틀렸으면 파일을 안 놓고 **예전처럼 빌드합니다** — build.gradle.kts 가
      # 파일이 있을 때만 플러그인을 켜고, 앱은 Firebase 초기화에 실패해 알림 없이 돕니다.
      # 알림 때문에 릴리스가 멈추면 안 되므로 이 단계는 실패하지 않고, 뒤에서 플러그인이
      # 빌드를 깰 파일(다른 앱의 패키지 · project_info 없음 · 앱 ID 모양이 틀림)은 여기서
      # 걸러 치웁니다 — 플러그인은 그런 파일에 "No matching client found" 나
      # GradleException 으로 `flutter build apk` 자체를 멈춥니다.
      #
      # 파일 내용은 로그에 찍지 않습니다. 안의 API 키도 add-mask 하지만, 이것은 막는 수단이
      # 아닙니다 — 같은 키가 APK 리소스(google_api_key)에 그대로 들어가고 APK 는 공개
      # 릴리스로 나가므로 키는 처음부터 공개입니다. 실제로 막는 것은 Google Cloud 의 API 키
      # 제한(패키지 · 서명 SHA-1 · 허용 API)이고, 처음 켤 때 LOCAL-TASKS 28 에서 겁니다.
      #
      # 이유 문구에는 패키지 이름을 넣지 않습니다. 서명 열쇠 별칭(mybody)이 비밀이라 그
      # 글자가 든 출력은 깃허브가 통째로 버립니다(아래 「꾸러미 이름」 참고).
      - name: 앱 알림 설정 꺼내기 (파이어베이스)
        id: fcm
        env:
          GS: ${{ secrets.FIREBASE_ANDROID_JSON_B64 }}
        run: |
          set +x
          f=app/android/app/google-services.json
          off() {
            rm -f "$f"
            echo "on=no" >> "$GITHUB_OUTPUT"
            echo "why=$1" >> "$GITHUB_OUTPUT"
          }
          if [ -z "$GS" ]; then
            echo "푸시 설정 없음 — 푸시 없이 빌드 (Secrets 에 FIREBASE_ANDROID_JSON_B64 가 없습니다)"
            off "FIREBASE_ANDROID_JSON_B64 없음"
            exit 0
          fi
          # 붙여 넣을 때 섞인 줄바꿈 · 공백은 버리고 풉니다.
          printf '%s' "$GS" | tr -d '\r\n\t ' | base64 -d > "$f" 2>/dev/null || true
          rc=0
          python3 - "$f" <<'PY' || rc=$?
          import json, sys
          PKG = 'io.github.iacobuschoi.mybody'
          try:
              j = json.load(open(sys.argv[1], encoding='utf-8'))
              if not isinstance(j, dict) or not isinstance(j.get('client'), list):
                  sys.exit(3)
              clients = j['client']
              # 판정보다 먼저 가립니다 — 틀린 파일이어도 키는 키입니다.
              for c in clients:
                  for k in (c.get('api_key') or []):
                      v = k.get('current_key')
                      if v:
                          print('::add-mask::' + v)
              hit = [c for c in clients
                     if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == PKG]
          except Exception:
              sys.exit(3)
          if not hit:
              sys.exit(4)
          import re
          app_id = hit[0].get('client_info', {}).get('mobilesdk_app_id') or ''
          if not re.fullmatch(r'1:[0-9]+:android:[0-9a-f]+', str(app_id)):
              sys.exit(5)
          # google-services 플러그인은 project_info 가 없으면 GradleException 으로 빌드를 깹니다.
          # 여기서 거르지 않으면 "알림 없이 빌드" 가 아니라 릴리스 자체가 멈춥니다.
          pi = j.get('project_info') or {}
          if not isinstance(pi, dict) or not str(pi.get('project_number') or '').isdigit() or not pi.get('project_id'):
              sys.exit(6)
          PY
          case "$rc" in
            0) echo "on=yes" >> "$GITHUB_OUTPUT"
               echo "앱 알림 설정을 놓았습니다 — 이 빌드는 FCM 을 씁니다" ;;
            3) echo "::warning::FIREBASE_ANDROID_JSON_B64 를 google-services.json 으로 못 읽었습니다 — 푸시 없이 빌드합니다"
               off "FIREBASE_ANDROID_JSON_B64 가 base64 로 싼 JSON 이 아님" ;;
            4) echo "::warning::google-services.json 에 이 앱의 패키지(applicationId)가 없습니다 — 푸시 없이 빌드합니다"
               off "google-services.json 이 다른 앱의 것 (Firebase 에 등록한 패키지 이름 확인)" ;;
            5) echo "::warning::google-services.json 의 앱 ID(mobilesdk_app_id)가 안드로이드 앱 ID 모양이 아닙니다 — 푸시 없이 빌드합니다"
               off "google-services.json 의 mobilesdk_app_id 가 없거나 모양이 틀림" ;;
            *) echo "::warning::google-services.json 에 project_info(project_number · project_id)가 없습니다 — 푸시 없이 빌드합니다"
               off "google-services.json 이 불완전함 (project_info)" ;;
          esac

      # 안드로이드 사용 승낙. 깃허브 기계는 보통 이미 돼 있습니다.
      # 안 돼 있을 때 빌드가 거기서 멈추는 걸 막으려고 한 번 눌러 둡니다.
      - name: 안드로이드 사용 승낙
        run: yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      - name: 묶음 받기
        working-directory: app
        run: flutter pub get

      # 폰에 깔았을 때 되는지 보는 검사 (인터넷 권한 · 앱 아이디 · 이름 ·
      # 아이콘 · 서명 · 빌드 번호). 여기서 먼저 걸리면 20분짜리 빌드를
      # 돌려 놓고 못 쓰는 앱을 받는 일이 없습니다.
      - name: 설정 검사
        run: node tools/test-android.js

      - name: 코드 검사
        working-directory: app
        run: flutter analyze

      # 시험이 멈추면(플러그인 응답을 기다리는 await 같은 것) flutter_test 는
      # 시험 하나에 10분씩 기다립니다 — 27개면 네 시간 반. 그 전에 끊습니다.
      - name: 화면 시험
        working-directory: app
        timeout-minutes: 10
        run: flutter test

      # 폰은 versionCode 가 더 큰 것만 업데이트로 받습니다. pubspec 에는
      # 빌드 번호가 없어서 그냥 두면 **전부 1번**이 되고, 두 번째 앱부터
      # 폰이 "이미 최신입니다" 하고 안 받습니다. 커밋 수를 씁니다(위).
      # **받는 사람 입장에서 크기를 깎습니다.**
      #
      # 기본값은 CPU 종류를 **세 벌** 넣습니다 — arm64(요즘 폰) · arm(옛날 폰)
      # · x86_64. 마지막 것은 **에뮬레이터 전용**이라 진짜 폰에서는 한 번도
      # 안 쓰이는데 10MB 쯤을 차지합니다. 빼도 못 깔리는 폰이 없습니다.
      #
      # --split-debug-info 는 디버그 기호를 앱 밖으로 뺍니다. 오류 추적에
      # 필요한 것이라 버리지 않고 build/symbols 에 남겨 둡니다.
      - name: 앱 파일 만들기
        working-directory: app
        env:
          # 서버 주소를 앱에 넣어 둡니다. 없으면 빈 값으로 들어가고, 앱은
          # 예전처럼 사용자에게 주소를 묻습니다.
          SERVER_URL: ${{ secrets.MYBODY_SERVER_URL }}
        run: |
          flutter build apk --release \
            --build-number=${{ steps.vc.outputs.code }} \
            --build-name=${{ steps.vc.outputs.name }} \
            --target-platform android-arm,android-arm64 \
            --split-debug-info=build/symbols \
            --dart-define=SERVER_URL="$SERVER_URL"

      # 플레이스토어는 새 앱을 **APK 로 안 받습니다** — .aab 여야 합니다.
      # 친구들한테 바로 주는 건 APK 라, 둘 다 만듭니다.
      # 스토어용은 CPU 를 안 깎습니다. 플레이가 기기마다 알맞은 조각만
      # 내려보내므로, 넣어 둬도 받는 사람이 더 받지 않습니다.
      - name: 스토어용 묶음(AAB) 만들기
        working-directory: app
        env:
          SERVER_URL: ${{ secrets.MYBODY_SERVER_URL }}
        run: |
          flutter build appbundle --release \
            --build-number=${{ steps.vc.outputs.code }} \
            --build-name=${{ steps.vc.outputs.name }} \
            --split-debug-info=build/symbols \
            --dart-define=SERVER_URL="$SERVER_URL" \
            --dart-define=STORE=play

      - name: 만들어졌는지 확인
        id: find
        run: |
          apk=$(find app/build -name 'app-release.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "app-release.apk 를 못 찾았습니다"; find app/build -name '*.apk'; exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "APK  $(du -h "$apk" | cut -f1)"
          { echo ""; echo "APK 크기 **$(du -h "$apk" | cut -f1)** · versionCode **${{ steps.vc.outputs.code }}**"; } >> "$GITHUB_STEP_SUMMARY"
          # outputs/bundle/release 아래만 봅니다. 그냥 find 하면 서명 전 중간 파일
          # (intermediates/…/intermediary-bundle.aab)을 먼저 집을 때가 있어서
          # v0.2.3 릴리스에 서명 안 된 AAB 가 올라갔습니다.
          aab=$(find app/build -path '*outputs/bundle/release/*' -name '*.aab' | head -1)
          if [ -z "$aab" ]; then
            echo "app-release.aab 를 못 찾았습니다"; find app/build -name '*.aab'; exit 1
          fi
          # 서명이 들어 있는지 — 없으면 플레이 콘솔이 거부합니다.
          if ! unzip -l "$aab" | grep -qE 'META-INF/[^/]+\.(RSA|EC|DSA)$'; then
            echo "AAB 에 서명이 없습니다: $aab"; unzip -l "$aab" | grep META-INF || true; exit 1
          fi
          echo "aab=$aab" >> "$GITHUB_OUTPUT"
          echo "AAB  $(du -h "$aab" | cut -f1)"

      # **만든 앱을 열어서 확인합니다.**
      #
      # 설정 파일이 맞는 것과 나온 앱이 맞는 것은 다른 얘기입니다. 인터넷
      # 권한은 빠져도 빌드가 멀쩡히 성공하고, 친구 폰에 들어가서야 드러납니다.
      # 그래서 APK 안의 매니페스트를 직접 열어서 봅니다.
      - name: 나온 앱에 인터넷 권한이 있는가
        run: |
          python3 - "${{ steps.find.outputs.path }}" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          raw = zipfile.ZipFile(apk).read('AndroidManifest.xml')
          # 컴파일된 매니페스트라 글자가 UTF-8 이거나 UTF-16 입니다. 둘 다 봅니다.
          want = 'android.permission.INTERNET'
          found = want.encode() in raw or want.encode('utf-16-le') in raw
          print(('있습니다' if found else '없습니다') + ': ' + want)
          if not found:
              print('이 앱은 깔려도 서버에 못 붙습니다.')
              sys.exit(1)
          for name in ('io.github.iacobuschoi.mybody',):
              ok = name.encode() in raw or name.encode('utf-16-le') in raw
              print(('있습니다' if ok else '없습니다') + ': ' + name)
              if not ok:
                  sys.exit(1)
          PY

      # **앱 알림 설정이 앱 안에 들어갔는지 봅니다.**
      #
      # 파일을 놓았는데 플러그인이 안 켜지면(조건 apply 가 빠지는 등) 빌드는 초록인 채로
      # 알림 없는 앱이 나가고, 친구 폰에 독촉이 안 와서야 압니다. 플러그인이 만든
      # google_app_id 가 APK 의 리소스에 있는지 봅니다(Firebase 가 이 이름으로 설정을 찾고,
      # 리소스 줄이기에서도 지켜지는 값입니다). 알림은 부가 기능이라 경고만 하고 막지는 않습니다.
      - name: 나온 앱에 앱 알림 설정이 있는가
        env:
          FCM_ON: ${{ steps.fcm.outputs.on }}
          FCM_WHY: ${{ steps.fcm.outputs.why }}
          APK: ${{ steps.find.outputs.path }}
        run: |
          if [ "$FCM_ON" = yes ]; then
            rc=0
            python3 - "$APK" <<'PY' || rc=$?
          import sys, zipfile
          raw = zipfile.ZipFile(sys.argv[1]).read('resources.arsc')
          want = 'google_app_id'
          sys.exit(0 if (want.encode() in raw or want.encode('utf-16-le') in raw) else 1)
          PY
            if [ "$rc" = 0 ]; then
              line="앱 알림(FCM): **켜짐** — 설정이 앱에 들어갔습니다"
            else
              line="앱 알림(FCM): **확인 필요** — 설정 파일을 놓았는데 APK 에 google_app_id 가 없습니다 (build.gradle.kts 의 google-services 적용을 보세요)"
              echo "::warning::$line"
            fi
          else
            line="앱 알림(FCM): 꺼짐 — ${FCM_WHY:-설정 없음}. 켜는 법: docs/PUSH.md"
          fi
          echo "$line"
          { echo ""; echo "$line"; } >> "$GITHUB_STEP_SUMMARY"

      # **어느 열쇠로 서명됐는지 봅니다.**
      #
      # 비밀값을 넣었는데 이름을 하나 잘못 적으면, 빌드는 그냥 성공하고
      # 조용히 디버그 열쇠로 서명됩니다. 그러면 친구 폰에서 업데이트가
      # 거부될 때까지 모릅니다. 지문을 찍어 두면 눈으로 확인됩니다.
      - name: 서명 지문
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$signer" ]; then echo "apksigner 가 없어 건너뜁니다"; exit 0; fi
          fp=$("$signer" verify --print-certs "${{ steps.find.outputs.path }}" \
               | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: *//')
          echo "지문 $fp"
          {
            echo ""
            echo "서명 지문 (SHA-256): \`$fp\`"
            echo ""
            echo "열쇠를 넣은 뒤에는 이 값이 **바뀌고, 그 뒤로 계속 같아야 합니다.**"
            echo "매번 달라지면 디버그 열쇠로 서명되고 있는 것입니다."
          } >> "$GITHUB_STEP_SUMMARY"

      # **이름에 `mybody` 를 넣으면 안 됩니다.**
      #
      # 서명 열쇠의 별칭이 `mybody` 라, 깃허브는 그 글자를 비밀값으로 보고
      # 로그와 출력에서 전부 가립니다. 그래서 꾸러미 이름이 `***-11-apk` 가
      # 되고, 잡의 출력은 아예 안 나갑니다:
      #
      #     ##[warning]Skip output 'artifact' since it may contain secret.
      #
      # 그러면 배포 쪽에서 받을 이름이 빈 값이 되어 다운로드가 실패합니다.
      # 빌드는 초록인 채로요. 겹치지 않는 이름을 씁니다.
      - name: 꾸러미 이름
        id: name
        run: echo "artifact=app-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            ${{ steps.find.outputs.path }}
            ${{ steps.find.outputs.aab }}
          retention-days: 90
          if-no-files-found: error

      - name: 무슨 열쇠로 서명됐는지 적어 두기
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "yes" ]; then
            echo "### 앱 파일이 준비됐습니다" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "내 열쇠로 서명했습니다. 다음에 만든 것도 업데이트로 깔립니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 앱 파일이 준비됐습니다 — 다만 읽어 주세요" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "서명 열쇠가 없어서 **디버그 열쇠**로 서명했습니다." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "지금 나눠 주는 데는 아무 문제 없습니다. 그런데 그 열쇠는" >> "$GITHUB_STEP_SUMMARY"
            echo "빌드하는 기계마다 다르게 만들어집니다. 그래서 **다음에 만든" >> "$GITHUB_STEP_SUMMARY"
            echo "앱은 친구 폰에 업데이트로 안 깔립니다** — 지웠다 다시 깔아야" >> "$GITHUB_STEP_SUMMARY"
            echo "하고, 그러면 그 폰에 있던 기록이 사라집니다." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "열쇠 만드는 법: \`docs/APK.md\`" >> "$GITHUB_STEP_SUMMARY"
          fi
