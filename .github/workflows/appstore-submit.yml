# =============================================================================
# 앱스토어 심사 · TestFlight 베타 심사를 새 빌드로 다시 올리기 — 애플 웹 로그인 없이
#
#   version  판 번호 (예: 0.2.15)
#   build    빌드 번호 (예: 298 — 릴리스의 커밋 수)
#   beta     외부 테스트 그룹 이름 (none 이면 베타는 건너뜀 — 비워 보내면 기본값 friends 가 들어옴)
#   submit   끄면 읽기만 합니다 — 지금 걸린 심사 · 판 · 빌드 상태와 할 일을 찍습니다.
#            켜면 걸린 심사를 취소하고 그 판을 새 번호 · 새 빌드로 바꿔 다시 제출합니다.
#            거절된 제출(UNRESOLVED_ISSUES) 하나뿐이면 취소하지 않고 같은 제출로 다시 냅니다.
#            appstore/review-notes-<판>.txt 가 있으면 「App Review 정보 → 메모」 에 덧붙입니다.
#   link_only  판 · 빌드는 두고 beta 그룹의 TestFlight 공개 링크만 봅니다(submit 이면 켭니다).
#   link_off   link_only 와 함께 켜면 반대로 공개 링크를 닫습니다(submit 이면).
#   release    심사 통과(PENDING_DEVELOPER_RELEASE)한 version 판을 앱스토어에 출시합니다(submit 이면).
#              build 는 안 받고, 심사 제출 · 베타 · 공개 링크는 건드리지 않습니다. 아직 승인 전이면
#              아무것도 안 하고 성공으로 끝납니다(여러 번 돌려도 무해). 심사에서 빠졌으면(거절 · 철회)
#              실패로 끝납니다 — 고쳐서 다시 내야 합니다. link_only 와 함께는 못 켭니다.
#              로그의 「앱스토어 페이지: 공개됨 (판 …)」 이 실제로 가게에 뜬 신호입니다.
#
# Secrets 는 아이폰 TestFlight 와 같습니다: ASC_KEY_ID · ASC_ISSUER_ID · ASC_KEY_P8(또는 _BASE64).
# 하는 일의 자세한 순서와 멈추는 자리: tools/asc-submit.js 머리말.
# =============================================================================
name: 앱스토어 심사 다시 올리기

on:
  workflow_dispatch:
    inputs:
      version:
        description: '판 번호 (예: 0.2.15) — link_only 면 비워도 됨'
        required: false
        default: ''
      build:
        description: '빌드 번호 (예: 298) — link_only · release 면 비워도 됨'
        required: false
        default: ''
      beta:
        description: '외부 테스트 그룹 (none 이면 베타 건너뜀)'
        required: false
        default: 'friends'
      drop_old_beta:
        description: '그 그룹의 옛 빌드는 빼기'
        type: boolean
        default: true
      beta_only:
        description: '베타만 (앱스토어 심사는 안 건드림)'
        type: boolean
        default: false
      whats_new:
        description: 'TestFlight 「테스트할 내용」'
        required: false
        default: ''
      link_only:
        description: 'TestFlight 공개 링크만 (읽기 · submit 이면 켜기)'
        type: boolean
        default: false
      link_off:
        description: 'link_only 와 함께: 공개 링크를 닫기 (submit 이면)'
        type: boolean
        default: false
      release:
        description: '심사 통과(PENDING_DEVELOPER_RELEASE) 판을 앱스토어에 출시 — submit 과 함께'
        type: boolean
        default: false
      submit:
        description: '실제로 제출 (끄면 읽기만)'
        type: boolean
        default: false

concurrency:
  group: appstore-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 제출
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD: ${{ inputs.build }}
          IN_BETA: ${{ inputs.beta }}
          IN_DROP: ${{ inputs.drop_old_beta }}
          IN_BETA_ONLY: ${{ inputs.beta_only }}
          IN_WHATS_NEW: ${{ inputs.whats_new }}
          IN_SUBMIT: ${{ inputs.submit }}
          IN_LINK_ONLY: ${{ inputs.link_only }}
          IN_LINK_OFF: ${{ inputs.link_off }}
          IN_RELEASE: ${{ inputs.release }}
        run: |
          set +x
          if [ "$IN_RELEASE" = "true" ]; then
            # 둘 다 켜면 어느 쪽을 뜻했는지 모르니 고르지 않고 멈춥니다.
            if [ "$IN_LINK_ONLY" = "true" ]; then
              echo "::error::release 와 link_only 는 함께 켤 수 없습니다"
              exit 1
            fi
            args=(--release --version "$IN_VERSION")
            [ "$IN_SUBMIT" = "true" ] && args+=(--submit)
            node tools/asc-submit.js "${args[@]}"
            exit $?
          fi
          # 베타 그룹이 꼭 있어야 하는 길(베타만 · 공개 링크)에 none 이 오면 아무것도 안 하고 멈춥니다.
          if { [ "$IN_LINK_ONLY" = "true" ] || [ "$IN_BETA_ONLY" = "true" ]; } && { [ -z "$IN_BETA" ] || [ "$IN_BETA" = "none" ]; }; then
            echo "::error::link_only · beta_only 에는 베타 그룹(beta)이 필요합니다 — none 은 안 됩니다"
            exit 1
          fi
          if [ "$IN_LINK_ONLY" = "true" ]; then
            args=(--link-only --beta "$IN_BETA")
            [ "$IN_LINK_OFF" = "true" ] && args+=(--link-off)
            [ "$IN_SUBMIT" = "true" ] && args+=(--submit)
            node tools/asc-submit.js "${args[@]}"
            exit $?
          fi
          args=(--version "$IN_VERSION" --build "$IN_BUILD")
          # beta 를 비워 보내도 기본값(friends)이 들어옵니다 — 베타를 건너뛰려면 none.
          [ -n "$IN_BETA" ] && [ "$IN_BETA" != "none" ] && args+=(--beta "$IN_BETA")
          # 그 판의 심사 메모가 저장소에 있으면 「App Review 정보 → 메모」 에 덧붙입니다(submit 일 때만 바꿈).
          notes="appstore/review-notes-$IN_VERSION.txt"
          [ "$IN_BETA_ONLY" != "true" ] && [ -f "$notes" ] && args+=(--review-notes-file "$notes")
          [ "$IN_DROP" = "true" ] && args+=(--drop-old-beta)
          [ "$IN_BETA_ONLY" = "true" ] && args+=(--beta-only)
          [ -n "$IN_WHATS_NEW" ] && args+=(--whats-new "$IN_WHATS_NEW")
          [ "$IN_SUBMIT" = "true" ] && args+=(--submit)
          node tools/asc-submit.js "${args[@]}"
