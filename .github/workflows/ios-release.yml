# =============================================================================
# 아이폰 앱을 TestFlight 에 올리기 — 맥 없이, 폰에서 실행 버튼만 누르면 됩니다.
#
# 필요한 Secrets
#   ASC_KEY_ID          App Store Connect API 키 ID   (사용자 및 액세스 → 통합 → App Store Connect API)
#   ASC_ISSUER_ID       그 키의 Issuer ID
#   ASC_KEY_P8          그 키 파일(.p8) 의 **내용 그대로** (-----BEGIN PRIVATE KEY----- 부터 끝까지)
#                       base64 로 감싼 것을 ASC_KEY_P8_BASE64 에 넣어도 됩니다. 둘 중 하나면 됩니다.
#   MYBODY_SERVER_URL   (안드로이드와 같음)
#
# 앱 알림(선택 — 없으면 알림 없이 예전처럼 올립니다)
#   FIREBASE_IOS_PLIST_B64  Firebase 에서 받은 GoogleService-Info.plist 를 base64 한 줄로.
#                       있으면: plist 를 앱에 넣고 → (자동 서명이면) App ID 에 Push Notifications 를
#                       애플 API 로 켜고 → 프로파일에 aps-environment 가 들어왔을 때만 그 권한을 서명에
#                       붙입니다. 하나라도 안 맞으면 경고만 하고 알림 없이 올립니다. 자세히: docs/PUSH.md
#   APNs 열쇠(.p8)와 서버의 서비스 계정 JSON 은 여기 넣지 않습니다 — 각각 Firebase 콘솔과
#   서버 컴퓨터의 ~/.mybody/ 에만 둡니다.
#
# 초대 링크(Universal Links — 더 넣을 비밀 없음, MYBODY_SERVER_URL 의 호스트를 씀)
#   친구가 받은 https://<서버>/i/<코드> 를 누르면 사파리 없이 앱이 바로 열리게, 서명에
#   associated-domains = applinks:<서버 호스트> 를 붙입니다. (자동 서명이면) App ID 에 Associated
#   Domains 를 애플 API 로 켜고 → 프로파일에 그 권한이 들어왔을 때만 붙입니다. 하나라도 안 맞으면
#   경고만 하고 없이 올립니다 — 그때 링크는 사파리의 초대 페이지로 열립니다. 자세히: docs/DEPLOY.md 11절
#
# 인증서·프로파일은 이 러너가 애플 API 로 직접 만듭니다 (tools/asc.js):
#   openssl 로 열쇠와 CSR 을 만들고 → 배포 인증서를 발급받고 → 프로파일을 만들고 → 서명.
#   열쇠는 러너와 함께 사라지고, 다음 실행은 지난 인증서를 폐기하고 새로 만듭니다.
#   TestFlight 에 이미 올라간 빌드는 인증서를 폐기해도 영향이 없습니다.
#
# 맥에서 만든 인증서를 쓰고 싶으면 (선택) IOS_CERT_P12_BASE64 · IOS_CERT_PASSWORD ·
# IOS_PROFILE_BASE64 세 개를 넣으세요 — 있으면 그쪽을 씁니다.
#
# 판 번호는 안드로이드와 같은 규칙(커밋 수)이라 두 스토어가 같은 번호를 씁니다.
# =============================================================================
name: 아이폰 TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: '판 번호 (예: v0.2.4) — 기록용'
        required: true

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.2
  BUNDLE_ID: io.github.iacobuschoi.mybody
  PROFILE_NAME: Mybody AppStore GHA

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets 가 다 있는지
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          P8B: ${{ secrets.ASC_KEY_P8_BASE64 }}
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          missing=""
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8$P8B" ] && missing="$missing ASC_KEY_P8(또는 ASC_KEY_P8_BASE64)"
          if [ -n "$missing" ]; then
            echo "빠진 Secrets:$missing"
            echo "저장소 Settings → Secrets and variables → Actions 에 넣고 다시 돌리세요. 만드는 법: docs/DEPLOY.md 8절."
            exit 1
          fi
          if [ -n "$P12" ] && [ -n "$P12_PW" ] && [ -n "$PROFILE" ]; then
            echo "mode=manual" >> "$GITHUB_ENV"; echo "맥에서 만든 인증서를 씁니다."
          else
            echo "mode=auto" >> "$GITHUB_ENV"; echo "인증서와 프로파일을 애플 API 로 만듭니다."
          fi

      # **앱 알림(FCM → APNs) 설정 파일을 비밀에서 꺼냅니다.**
      #
      # 공개 저장소라 GoogleService-Info.plist 는 커밋하지 않습니다(.gitignore). 풀어 놓으면
      # Runner 타깃의 「Copy GoogleService-Info」 단계(project.pbxproj)가 파일이 있을 때만 앱에
      # 복사합니다. 비밀이 없거나 틀렸으면 파일을 안 놓고 알림 없이 **예전처럼 올립니다** —
      # firebase_core 가 설정이 없으면 초기화를 건너뛰고, APNs 등록도 하지 않습니다.
      #
      # 여기서 정한 fcm=yes/no 로 뒤의 서명이 갈리므로(App ID 푸시 켜기 · 엔타이틀먼트)
      # 인증서 단계보다 먼저 둡니다. fcm 은 뒤 단계가 끄기도 합니다(프로파일에 푸시가 없을 때).
      - name: 앱 알림 설정 꺼내기 (파이어베이스)
        env:
          GP: ${{ secrets.FIREBASE_IOS_PLIST_B64 }}
        run: |
          set +x
          f=app/ios/Runner/GoogleService-Info.plist
          off() {
            rm -f "$f"
            echo "fcm=no" >> "$GITHUB_ENV"
            echo "fcm_why=$1" >> "$GITHUB_ENV"
          }
          if [ -z "$GP" ]; then
            echo "푸시 설정 없음 — 푸시 없이 빌드 (Secrets 에 FIREBASE_IOS_PLIST_B64 가 없습니다)"
            off "FIREBASE_IOS_PLIST_B64 없음"
            exit 0
          fi
          # 붙여 넣을 때 섞인 줄바꿈 · 공백은 버리고 풉니다. 내용은 로그에 찍지 않습니다.
          printf '%s' "$GP" | tr -d '\r\n\t ' | base64 --decode > "$f" 2>/dev/null || true
          if ! plutil -lint -s "$f" >/dev/null 2>&1; then
            echo "::warning::FIREBASE_IOS_PLIST_B64 를 plist 로 못 읽었습니다 — 푸시 없이 빌드합니다"
            off "FIREBASE_IOS_PLIST_B64 가 base64 로 싼 plist 가 아님"
            exit 0
          fi
          get() { /usr/libexec/PlistBuddy -c "Print :$1" "$f" 2>/dev/null || true; }
          # 앱 안에 들어가는 값이라 비밀은 아니지만, 공개 로그에는 남기지 않습니다.
          key=$(get API_KEY)
          if [ -n "$key" ]; then echo "::add-mask::$key"; fi
          bid=$(get BUNDLE_ID)
          if [ "$bid" != "$BUNDLE_ID" ]; then
            echo "::warning::GoogleService-Info.plist 의 BUNDLE_ID 가 이 앱과 다릅니다 — 푸시 없이 빌드합니다"
            off "plist 의 BUNDLE_ID 가 다름 (Firebase 에 등록한 번들 ID 확인)"
            exit 0
          fi
          for k in GOOGLE_APP_ID GCM_SENDER_ID PROJECT_ID; do
            if [ -z "$(get "$k")" ]; then
              echo "::warning::GoogleService-Info.plist 에 $k 가 없습니다 — 푸시 없이 빌드합니다"
              off "plist 에 $k 가 없음"
              exit 0
            fi
          done
          # 값의 모양까지 봅니다. plist 가 앱에 들어가면 firebase_core 가 켜질 때 네이티브에서
          # FirebaseApp.configure() 를 부르는데, GOOGLE_APP_ID 가 틀리면 Dart 의 try/catch 가
          # 닿기도 전에 NSException 으로 **앱이 켜지자마자 죽습니다.** 그런 파일은 넣지 않습니다.
          if ! printf '%s' "$(get GOOGLE_APP_ID)" | grep -Eq '^1:[0-9]+:ios:[0-9a-f]+$'; then
            echo "::warning::GoogleService-Info.plist 의 GOOGLE_APP_ID 모양이 iOS 앱 ID(1:<숫자>:ios:<16진수>)가 아닙니다 — 푸시 없이 빌드합니다"
            off "plist 의 GOOGLE_APP_ID 가 iOS 앱 ID 가 아님 (안드로이드 앱 것이거나 잘림)"
            exit 0
          fi
          if ! printf '%s' "$(get GCM_SENDER_ID)" | grep -Eq '^[0-9]+$'; then
            echo "::warning::GoogleService-Info.plist 의 GCM_SENDER_ID 가 숫자가 아닙니다 — 푸시 없이 빌드합니다"
            off "plist 의 GCM_SENDER_ID 가 숫자가 아님"
            exit 0
          fi
          gcm=$(get IS_GCM_ENABLED)
          if [ -n "$gcm" ] && [ "$gcm" != true ]; then
            echo "::warning::GoogleService-Info.plist 의 IS_GCM_ENABLED 가 true 가 아닙니다 — 푸시 없이 빌드합니다"
            off "plist 의 IS_GCM_ENABLED 가 꺼져 있음"
            exit 0
          fi
          # 파일을 앱에 넣는 단계가 없는 판(옛 코드)이면 plist 가 번들에 안 들어갑니다 — 그런데도
          # 푸시 권한만 붙여 내보내지 않게 여기서 끕니다.
          if ! grep -q 'Copy GoogleService-Info' app/ios/Runner.xcodeproj/project.pbxproj; then
            echo "::warning::Xcode 프로젝트에 「Copy GoogleService-Info」 단계가 없습니다 — 푸시 없이 빌드합니다"
            off "Xcode 프로젝트에 plist 복사 단계가 없음"
            exit 0
          fi
          echo "fcm=yes" >> "$GITHUB_ENV"
          echo "앱 알림 설정을 놓았습니다 — 서명 단계에서 프로파일의 푸시 권한을 확인합니다"

      # **초대 링크(Universal Links)가 가리킬 호스트를 정합니다.**
      #
      # 친구가 받은 https://<서버>/i/<코드> 를 누르면 사파리를 거치지 않고 앱이 바로 열리게 하려면,
      # 앱 서명에 com.apple.developer.associated-domains = ["applinks:<서버 호스트>"] 권한이 붙어
      # 있어야 합니다. 폰은(애플 CDN 을 거쳐) 그 호스트의 /.well-known/apple-app-site-association
      # (서버가 내 줌)을 받아 "이 앱이 /i/* 를 연다" 를 확인합니다.
      #
      # 호스트는 앱에 박히는 서버 주소(아래 빌드의 --dart-define=SERVER_URL 과 같은 비밀)에서 뗍니다 —
      # 앱은 자기 서버의 링크만 초대로 받으므로 둘이 같아야 합니다. 안드로이드는 같은 일을
      # app/android/app/build.gradle.kts 가 합니다(같은 규칙 · 같은 기본값). 비밀이 비었으면
      # lib/main.dart 의 기본 주소와 같은 호스트를 씁니다.
      #
      # **이 단계는 실패하지 않습니다.** 주소가 https 가 아니거나 호스트 모양이 아니면 invite_host 를
      # 비우고 이유(ul_why)만 남깁니다 — 그러면 뒤 단계들이 권한 없이 예전처럼 빌드합니다(링크는
      # 사파리의 초대 페이지로 열리고, 거기서 mybody:// 로 앱에 이어집니다). 비밀에서 나온 값이라
      # 호스트는 로그에 찍지 않고(뒤 단계의 env: 목록에서도 *** 로 가림), GITHUB_ENV 에는 호스트
      # 모양([a-z0-9.-])을 통과한 것만 씁니다.
      - name: 초대 링크 주소 (Universal Links)
        env:
          SU: ${{ secrets.MYBODY_SERVER_URL }}
        run: |
          set +x
          fallback=desktop-il9c3if.tail0a8f8f.ts.net
          ul_off() {
            echo "invite_host=" >> "$GITHUB_ENV"
            echo "ul=no" >> "$GITHUB_ENV"
            echo "ul_why=$1" >> "$GITHUB_ENV"
            echo "::warning::초대 링크(Universal Links)를 끄고 빌드합니다 — $1"
          }
          # 붙여 넣을 때 섞인 줄바꿈 · 공백은 버립니다.
          raw=$(printf '%s' "$SU" | tr -d '\r\n\t ')
          if [ -z "$raw" ]; then
            host="$fallback"
            echo "MYBODY_SERVER_URL 이 비어 기본 주소의 호스트를 씁니다"
          else
            case "$raw" in
              [Hh][Tt][Tt][Pp][Ss]://*) rest="${raw#*://}" ;;
              *://*) ul_off "서버 주소(MYBODY_SERVER_URL)가 https 가 아님 — 연결된 도메인은 https 만 받습니다"; exit 0 ;;
              *) rest="$raw" ;;
            esac
            rest="${rest%%/*}"; rest="${rest%%\?*}"; rest="${rest%%#*}"   # 경로 · 물음 · 조각
            rest="${rest##*@}"                                         # 사용자:비밀번호@
            host=$(printf '%s' "${rest%%:*}" | tr 'A-Z' 'a-z')         # 포트 · 소문자
            host="${host%.}"
          fi
          label='[a-z0-9]([a-z0-9-]*[a-z0-9])?'
          if ! printf '%s' "$host" | grep -Eq "^$label(\.$label)+\$"; then
            ul_off "서버 주소(MYBODY_SERVER_URL)에서 호스트 이름을 못 뗌"; exit 0
          fi
          # 애플의 연결된 도메인은 IP 주소를 받지 않습니다.
          if printf '%s' "$host" | grep -Eq '^[0-9.]+$'; then
            ul_off "서버 주소가 IP 주소 — 연결된 도메인은 도메인 이름만 받습니다"; exit 0
          fi
          # GITHUB_ENV 에 쓴 값은 뒤 단계마다 로그 머리의 env: 목록에 그대로 펼쳐집니다. 비밀은 주소
          # 전체로만 가려지고 호스트 토막은 안 가려지므로, 비밀에서 뗀 호스트는 따로 가립니다(***).
          # 기본 호스트는 저장소(lib/main.dart)에 이미 있는 값이라 가리지 않습니다.
          if [ "$host" != "$fallback" ]; then echo "::add-mask::$host"; fi
          echo "invite_host=$host" >> "$GITHUB_ENV"
          echo "초대 링크 호스트를 정했습니다 — 서명 단계에서 프로파일의 연결된 도메인 권한을 확인합니다"

      - name: Flutter 캐시
        id: fcache
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Flutter 받기
        if: steps.fcache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
      - run: |
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"

      # API 키 파일 — altool 도 tools/asc.js 도 이걸 씁니다.
      - name: API 키 놓기
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          node tools/asc.js write-key ~/private_keys/AuthKey_"$(echo "$KEY_ID" | tr -d '[:space:]')".p8

      - name: 임시 키체인
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "KC=$KC" >> "$GITHUB_ENV"
          echo "KC_PW=$KC_PW" >> "$GITHUB_ENV"
          # 애플 중간 인증서 — 없으면 "Apple Distribution" 신원이 키체인에서 안 잡힙니다.
          for g in G3 G4 G5 G6; do
            curl -fsSL -o "$RUNNER_TEMP/wwdr$g.cer" "https://www.apple.com/certificateauthority/AppleWWDRCA$g.cer" && \
              security import "$RUNNER_TEMP/wwdr$g.cer" -k "$KC" -t cert -A >/dev/null 2>&1 || true
          done

      # ── 자동: App ID 에 Push Notifications 를 켭니다 (앱 알림 설정이 있을 때만) ──
      #
      # 프로파일의 aps-environment 는 App ID 에 Push 가 켜져 있어야 들어옵니다. 아래 단계가
      # 프로파일을 **매번 지우고 새로 만드므로**, 그 전에 한 번 켜 두면 새 프로파일에 저절로
      # 들어갑니다. 이미 켜져 있으면 아무것도 안 합니다(멱등).
      #
      # 실패해도(API 키 권한 · 애플 쪽 오류) 멈추지 않습니다. 결과는 「프로파일 설치」 단계가
      # 프로파일에 aps-environment 가 실제로 들어왔는지로 판정하고, 없으면 알림 없이 올립니다.
      #
      # 수동 모드(맥에서 만든 프로파일)에서는 켜지 않습니다. 켜는 순간 그 프로파일이 애플
      # 쪽에서 「무효」 가 되는데, 우리는 새로 만들 수 없기 때문입니다. docs/PUSH.md 참고.
      #
      # tools/asc.js 에 같은 일을 하는 ensureCapability 가 있으면 그것을 쓰고, 없는 판이면
      # 같은 요청(GET → 없으면 POST, 409 는 이미 있음)을 여기서 직접 합니다.
      - name: App ID 에 푸시 켜기 (애플 API)
        if: env.mode == 'auto' && env.fcm == 'yes'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set +x
          node - <<'JS'
          const fs = require('node:fs');
          const asc = require('./tools/asc.js');
          const env = process.env;
          const TYPE = 'PUSH_NOTIFICATIONS';
          async function ensure(c, bundleIdId) {
            if (typeof asc.ensureCapability === 'function') return asc.ensureCapability(c, bundleIdId, TYPE);
            /* limit 을 붙이면 애플이 400 PARAMETER_ERROR.ILLEGAL 로 거절합니다(0.2.16 빌드 로그) — 없이. */
            const r = await c.call('GET', `/v1/bundleIds/${bundleIdId}/bundleIdCapabilities`);
            if ((r.data || []).some(x => x.attributes && x.attributes.capabilityType === TYPE)) return { created: false };
            try {
              await c.call('POST', '/v1/bundleIdCapabilities', { data: {
                type: 'bundleIdCapabilities', attributes: { capabilityType: TYPE },
                relationships: { bundleId: { data: { type: 'bundleIds', id: bundleIdId } } } } });
              return { created: true };
            } catch (e) { if (e.status === 409) return { created: false }; throw e; }
          }
          (async () => {
            let state;
            /* 서명 도구가 --entitlements 를 모르는 판이면 권한을 서명에 못 붙입니다. 그때 App ID 를
               바꿔 봐야 알림은 안 켜지고 애플 쪽 설정만 헛되이 바뀝니다. */
            let signTool = {};
            try { signTool = require('./tools/ios-sign-project.js'); } catch (e) {}
            if (!signTool.supportsEntitlements) {
              console.log('::warning::tools/ios-sign-project.js 가 --entitlements 를 모르는 판입니다 — App ID 는 건드리지 않습니다');
              fs.appendFileSync(env.GITHUB_ENV, 'push_cap=skipped\n');
              return;
            }
            try {
              const c = asc.client({ keyId: String(env.ASC_KEY_ID || '').trim(),
                                     issuerId: String(env.ASC_ISSUER_ID || '').trim(), pem: asc.loadKeyPem(env) });
              const b = await asc.ensureBundleId(c, env.BUNDLE_ID, 'Mybody');
              const r = await ensure(c, b.id);
              state = r && r.created ? 'created' : 'on';
              console.log(state === 'created' ? 'App ID 에 Push Notifications 를 켰습니다'
                                              : 'App ID 에 Push Notifications 가 이미 켜져 있습니다');
            } catch (e) {
              state = 'failed';
              /* 애플이 준 오류(상태 · 코드 · 설명)만 찍습니다. 열쇠 · 토큰은 오류 문구에 없습니다. */
              const why = String((e && e.message) || e).replace(/\s+/g, ' ').slice(0, 300);
              console.log('::warning::App ID 에 Push Notifications 를 못 켰습니다 (' + why + ') — ' +
                          '프로파일에 푸시 권한이 없으면 이번 판은 알림 없이 올립니다');
            }
            fs.appendFileSync(env.GITHUB_ENV, 'push_cap=' + state + '\n');
          })();
          JS

      # ── 자동: App ID 에 Associated Domains 를 켭니다 (초대 링크 호스트가 정해졌을 때만) ──
      #
      # 위 푸시와 같은 이치입니다. 프로파일의 com.apple.developer.associated-domains 는 App ID 에
      # Associated Domains 가 켜져 있어야 들어오고, 다음 단계가 프로파일을 매번 새로 만드므로 그 전에
      # 한 번 켜 두면 됩니다(멱등 — 이미 켜져 있으면 아무것도 안 함). 같은 요청(GET → 없으면 POST,
      # 409 는 이미 있음, limit 없이)을 따로 합니다 — 푸시가 꺼진 날(파이어베이스 비밀 없음)에도
      # 초대 링크는 켜져야 하고, 한쪽 실패가 다른 쪽을 끌고 가지 않게 단계를 나눴습니다.
      #
      # 실패해도 멈추지 않습니다. 결과는 「프로파일 설치」 가 프로파일에 그 권한이 실제로 들어왔는지로
      # 판정하고, 없으면 초대 링크 없이 올립니다. 수동 모드(맥에서 만든 프로파일)에서는 켜지 않습니다 —
      # 켜는 순간 그 프로파일이 무효가 되는데 CI 는 새로 만들 수 없습니다(docs/DEPLOY.md 11절).
      - name: App ID 에 초대 링크(Associated Domains) 켜기 (애플 API)
        if: env.mode == 'auto' && env.invite_host != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set +x
          node - <<'JS' || echo "ul_cap=failed" >> "$GITHUB_ENV"
          const fs = require('node:fs');
          const asc = require('./tools/asc.js');
          const env = process.env;
          const TYPE = 'ASSOCIATED_DOMAINS';
          async function ensure(c, bundleIdId) {
            if (typeof asc.ensureCapability === 'function') return asc.ensureCapability(c, bundleIdId, TYPE);
            /* limit 을 붙이면 애플이 400 PARAMETER_ERROR.ILLEGAL 로 거절합니다(0.2.16 빌드 로그) — 없이. */
            const r = await c.call('GET', `/v1/bundleIds/${bundleIdId}/bundleIdCapabilities`);
            if ((r.data || []).some(x => x.attributes && x.attributes.capabilityType === TYPE)) return { created: false };
            try {
              await c.call('POST', '/v1/bundleIdCapabilities', { data: {
                type: 'bundleIdCapabilities', attributes: { capabilityType: TYPE },
                relationships: { bundleId: { data: { type: 'bundleIds', id: bundleIdId } } } } });
              return { created: true };
            } catch (e) { if (e.status === 409) return { created: false }; throw e; }
          }
          (async () => {
            let state;
            /* 권한을 서명에 붙이는 길(--entitlements)이 없는 판이면 App ID 만 헛되이 바뀝니다. */
            let signTool = {};
            try { signTool = require('./tools/ios-sign-project.js'); } catch (e) {}
            if (!signTool.supportsEntitlements) {
              console.log('::warning::tools/ios-sign-project.js 가 --entitlements 를 모르는 판입니다 — App ID 는 건드리지 않습니다');
              fs.appendFileSync(env.GITHUB_ENV, 'ul_cap=skipped\n');
              return;
            }
            try {
              const c = asc.client({ keyId: String(env.ASC_KEY_ID || '').trim(),
                                     issuerId: String(env.ASC_ISSUER_ID || '').trim(), pem: asc.loadKeyPem(env) });
              const b = await asc.ensureBundleId(c, env.BUNDLE_ID, 'Mybody');
              const r = await ensure(c, b.id);
              state = r && r.created ? 'created' : 'on';
              console.log(state === 'created' ? 'App ID 에 Associated Domains 를 켰습니다'
                                              : 'App ID 에 Associated Domains 가 이미 켜져 있습니다');
            } catch (e) {
              state = 'failed';
              /* 애플이 준 오류(상태 · 코드 · 설명)만 찍습니다. 열쇠 · 토큰은 오류 문구에 없습니다. */
              const why = String((e && e.message) || e).replace(/\s+/g, ' ').slice(0, 300);
              console.log('::warning::App ID 에 Associated Domains 를 못 켰습니다 (' + why + ') — ' +
                          '프로파일에 연결된 도메인 권한이 없으면 이번 판은 초대 링크(Universal Links) 없이 올립니다');
            }
            fs.appendFileSync(env.GITHUB_ENV, 'ul_cap=' + state + '\n');
          })();
          JS

      # ── 자동: 열쇠·CSR 을 만들고 애플 API 로 인증서와 프로파일을 발급 ──
      - name: 인증서·프로파일 만들기 (애플 API)
        if: env.mode == 'auto'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          S="$RUNNER_TEMP/sign"; mkdir -p "$S"
          /usr/bin/openssl req -new -newkey rsa:2048 -nodes -keyout "$S/key.pem" -out "$S/csr.pem" \
            -subj "/CN=Mybody GitHub Actions/C=KR" 2>/dev/null
          node tools/asc.js prepare --bundle "$BUNDLE_ID" --csr "$S/csr.pem" --out "$S" \
            --profile "$PROFILE_NAME" --github-env "$GITHUB_ENV"
          /usr/bin/openssl x509 -inform DER -in "$S/cert.cer" -out "$S/cert.pem"
          P12_PW="$(uuidgen)"
          /usr/bin/openssl pkcs12 -export -inkey "$S/key.pem" -in "$S/cert.pem" -out "$S/cert.p12" -passout "pass:$P12_PW"
          security import "$S/cert.p12" -P "$P12_PW" -A -t cert -f pkcs12 -k "$KC"
          cp "$S/profile.mobileprovision" "$RUNNER_TEMP/app.mobileprovision"

      # ── 수동: 맥에서 내보낸 .p12 와 프로파일 ──
      - name: 서명 재료 넣기 (맥에서 만든 것)
        if: env.mode == 'manual'
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PW" -A -t cert -f pkcs12 -k "$KC"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"

      - name: 프로파일 설치 · 팀 ID
        run: |
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          plist="$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision")"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$plist")
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin <<< "$plist")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          echo "profile_uuid=$uuid" >> "$GITHUB_ENV"
          echo "profile_name=$name" >> "$GITHUB_ENV"
          echo "team_id=$team" >> "$GITHUB_ENV"
          echo "프로파일 $name · 팀 $team"
          # 이 프로파일에 푸시 권한이 들어 있는가(App ID 에 Push 가 켜진 뒤 만든 프로파일이면
          # production). 앱 알림을 서명에 붙일지는 이 값으로 정합니다 — 없는데 붙이면 서명이 깨집니다.
          aps=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' /dev/stdin <<< "$plist" 2>/dev/null || true)
          echo "profile_aps=$aps" >> "$GITHUB_ENV"
          echo "프로파일의 푸시 권한(aps-environment): ${aps:-없음}"
          # 연결된 도메인 권한(초대 링크)도 같은 식으로 봅니다. App Store 프로파일에는 보통 "*"
          # 하나가 들어 있고(어느 applinks: 든 허락), 배열일 수도 있어 값은 옮기지 않고 있고 없고만
          # 적습니다(GITHUB_ENV 는 한 줄 값만 받습니다). 없는데 붙이면 서명이 깨집니다.
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.associated-domains' /dev/stdin <<< "$plist" >/dev/null 2>&1; then
            ad=yes
          else
            ad=no
          fi
          echo "profile_ad=$ad" >> "$GITHUB_ENV"
          echo "프로파일의 연결된 도메인 권한(associated-domains): $([ "$ad" = yes ] && echo 있음 || echo 없음)"
          security find-identity -v -p codesigning "$KC"

      - name: 내보내기 설정
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${team_id}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${profile_name}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

      # 앱 타깃(Runner)의 Release·Profile 만 수동 서명으로 바꿉니다. 명령줄로 넘기면
      # 플러그인 Pods 타깃까지 걸려 "does not support provisioning profiles" 로 멈춥니다.
      #
      # 서명에 붙이는 권한은 둘이고, 둘 다 **조건이 맞을 때만** 붙입니다. Runner.entitlements 는
      # 커밋돼 있지만 프로젝트는 그 파일을 가리키지 않습니다 — 프로파일에 없는 권한을 붙이면
      # "doesn't match the entitlements file" 로 서명이 깨져 릴리스가 멈추기 때문입니다.
      #   · 앱 알림(aps-environment): 설정 plist 가 놓였고(fcm=yes), 설치한 프로파일에
      #     aps-environment 가 있을 때. 값은 프로파일의 것 그대로(App Store 프로파일은 production).
      #   · 초대 링크(com.apple.developer.associated-domains = ["applinks:<서버 호스트>"]): 호스트가
      #     정해졌고(invite_host), 프로파일에 그 권한이 있을 때(profile_ad=yes).
      # 파일에는 **이번에 붙일 것만** 남깁니다 — 커밋된 파일에는 aps-environment 가 있어서, 푸시 없이
      # 초대 링크만 붙이는 날 그대로 두면 서명이 깨집니다. 둘 다 아니면 예전처럼 파일을 안 붙입니다.
      #
      # 앱 알림 조건이 안 맞으면 plist 를 치우고 fcm=no 로 내려 **알림 없이** 올립니다. 권한 없이
      # 설정만 들어간 앱은 알림 주소(APNs 토큰)를 영영 못 받으니, 반쯤 켠 채로 내보내지 않습니다.
      # 초대 링크 조건이 안 맞으면 ul=no 로 **초대 링크 없이** 올립니다 — 링크는 사파리의 초대
      # 페이지로 열리고 거기서 mybody:// 로 앱에 이어지니, 끊기지 않고 한 번 더 누를 뿐입니다.
      - name: 앱 타깃 서명 설정
        run: |
          set +x
          ent=app/ios/Runner/Runner.entitlements
          pb=/usr/libexec/PlistBuddy
          AD=com.apple.developer.associated-domains
          off() {
            rm -f app/ios/Runner/GoogleService-Info.plist
            echo "fcm=no" >> "$GITHUB_ENV"
            echo "fcm_why=$1" >> "$GITHUB_ENV"
            echo "::warning::앱 알림을 끄고 올립니다 — $1"
          }
          ul_reason="${ul_why:-}"
          ul_off() {
            ul_reason="$1"
            echo "ul=no" >> "$GITHUB_ENV"
            echo "ul_why=$1" >> "$GITHUB_ENV"
            echo "::warning::초대 링크(Universal Links)를 끄고 올립니다 — $1"
          }
          want_aps=no
          want_ad=no
          if [ "$fcm" = yes ] && [ -n "$profile_aps" ]; then
            want_aps=yes
          elif [ "$fcm" = yes ]; then
            if [ "$mode" = manual ]; then
              off "프로파일(IOS_PROFILE_BASE64)에 푸시 권한이 없음 — developer.apple.com → Identifiers 에서 Push Notifications 를 켜고 프로파일을 다시 만들어 갈아 넣으세요"
            else
              off "새로 만든 프로파일에 푸시 권한이 없음 (App ID 푸시 켜기: ${push_cap:-안 함}) — docs/PUSH.md 문제 해결"
            fi
          fi
          if [ -z "${invite_host:-}" ]; then
            # 「초대 링크 주소」 단계가 이미 ul=no · 이유를 적었습니다.
            ul_reason="${ul_reason:-초대 링크 호스트가 정해지지 않음}"
          elif [ "$profile_ad" = yes ]; then
            want_ad=yes
          elif [ "$mode" = manual ]; then
            ul_off "프로파일(IOS_PROFILE_BASE64)에 연결된 도메인 권한이 없음 — developer.apple.com → Identifiers 에서 Associated Domains 를 켜고 프로파일을 다시 만들어 갈아 넣으세요"
          else
            ul_off "새로 만든 프로파일에 연결된 도메인 권한이 없음 (App ID Associated Domains 켜기: ${ul_cap:-안 함}) — docs/DEPLOY.md 11절"
          fi
          # 엔타이틀먼트 파일을 이번 서명에 붙일 것만 남게 고칩니다(러너 안에서만, 커밋 안 함).
          # 파일이 없는 판이어도 PlistBuddy 가 같은 내용을 만들어 씁니다.
          if [ "$want_aps" = yes ]; then
            $pb -c "Set :aps-environment $profile_aps" "$ent" 2>/dev/null ||
              $pb -c "Add :aps-environment string $profile_aps" "$ent"
          else
            $pb -c "Delete :aps-environment" "$ent" >/dev/null 2>&1 || true
          fi
          $pb -c "Delete :$AD" "$ent" >/dev/null 2>&1 || true
          if [ "$want_ad" = yes ]; then
            if ! $pb -c "Add :$AD array" -c "Add :$AD:0 string applinks:$invite_host" "$ent" >/dev/null 2>&1; then
              $pb -c "Delete :$AD" "$ent" >/dev/null 2>&1 || true
              want_ad=no
              ul_off "Runner.entitlements 에 applinks 를 못 적음 (PlistBuddy)"
            fi
          fi
          extra=""
          if [ "$want_aps" = yes ] || [ "$want_ad" = yes ]; then
            extra="--entitlements Runner/Runner.entitlements"
          fi
          node tools/ios-sign-project.js --team "$team_id" --profile "$profile_name" --bundle "$BUNDLE_ID" $extra
          # 서명 도구가 --entitlements 를 모르는 판이면 조용히 무시됩니다. 실제로 들어갔는지
          # 프로젝트 파일에서 확인하고, 안 들어갔으면 둘 다 끕니다(Release · Profile 두 곳).
          if [ -n "$extra" ]; then
            n=$(grep -cE 'CODE_SIGN_ENTITLEMENTS = "?Runner/Runner\.entitlements"?;' app/ios/Runner.xcodeproj/project.pbxproj || true)
            if [ "${n:-0}" -lt 2 ]; then
              if [ "$want_aps" = yes ]; then
                off "tools/ios-sign-project.js 가 엔타이틀먼트를 넣지 못함 (--entitlements 지원 확인)"
              fi
              if [ "$want_ad" = yes ]; then
                ul_off "tools/ios-sign-project.js 가 엔타이틀먼트를 넣지 못함 (--entitlements 지원 확인)"
              fi
              want_aps=no
              want_ad=no
            elif [ "$want_aps" = yes ]; then
              echo "앱 알림 권한을 서명에 붙였습니다 (aps-environment=$profile_aps)"
            fi
          fi
          if [ "$want_ad" = yes ]; then
            echo "ul=yes" >> "$GITHUB_ENV"
            echo "초대 링크(Universal Links): 켜짐 — applinks 권한을 서명에 붙였습니다 (프로파일 associated-domains 있음 · App ID Associated Domains: ${ul_cap:-확인 안 함(수동 모드)})"
          else
            echo "초대 링크(Universal Links): 꺼짐 — ${ul_reason:-이유 모름}"
          fi

      - name: 아이폰 앱 만들기 (.ipa)
        working-directory: app
        env:
          SERVER_URL: ${{ secrets.MYBODY_SERVER_URL }}
        run: |
          flutter pub get
          # 판 이름은 실행할 때 넣은 v1.2.3 에서 — 안 맞으면 pubspec.yaml 그대로.
          v="${{ github.event.inputs.version }}"; v="${v#v}"
          if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then bn="--build-name=$v"; else bn=""; fi
          flutter build ipa --release $bn \
            --build-number=$(git rev-list --count HEAD) \
            --export-options-plist="$RUNNER_TEMP/export.plist" \
            --dart-define=SERVER_URL="$SERVER_URL"
          mkdir -p "$RUNNER_TEMP/ipa"
          cp build/ios/ipa/*.ipa "$RUNNER_TEMP/ipa/"
          ls -la "$RUNNER_TEMP/ipa"

      # **나온 앱을 열어 앱 알림이 정말 들어갔는지 봅니다.** 설정 plist 가 번들에 복사됐는지
      # (Copy GoogleService-Info 단계)와 서명에 aps-environment 가 붙었는지. 둘 중 하나만
      # 있으면 알림이 안 오는데 빌드는 초록입니다. 알림은 부가 기능이라 경고만 하고 막지 않습니다.
      # 초대 링크도 같이 봅니다 — 켰으면(ul=yes) 서명에 associated-domains 와 applinks:<호스트>
      # 가 실제로 있어야 합니다. 없으면 링크가 사파리로만 열리는데 빌드는 초록입니다. 이것도 경고만.
      #
      # "경고만" 을 지키려고 이 단계 자체가 실패해도 다음 단계(TestFlight 올리기)는 돕니다
      # (continue-on-error). 기본 셸이 bash -e 라, unzip 의 경고 종료코드(1) 하나로도 여기서
      # 멈추면 비밀이 없는 날의 릴리스까지 막힙니다.
      - name: 나온 앱에 앱 알림이 들어갔는가
        continue-on-error: true
        run: |
          ipa=$(ls "$RUNNER_TEMP"/ipa/*.ipa 2>/dev/null | head -1 || true)
          if [ -z "$ipa" ]; then echo "::warning::확인할 .ipa 가 없습니다 — 앱 알림 확인을 건너뜁니다"; exit 0; fi
          x="$RUNNER_TEMP/ipa-x"; rm -rf "$x"; mkdir -p "$x"
          # unzip 은 경고만 있어도 1 을 냅니다 — 2 이상일 때만 진짜 실패입니다.
          unzip -q "$ipa" -d "$x" || [ $? -le 1 ]
          app=$(ls -d "$x"/Payload/*.app 2>/dev/null | head -1 || true)
          if [ -z "$app" ]; then echo "::warning::.ipa 안에 앱이 없습니다 — 앱 알림 확인을 건너뜁니다"; rm -rf "$x"; exit 0; fi
          if [ -f "$app/GoogleService-Info.plist" ]; then has_plist=yes; else has_plist=no; fi
          ents=$(codesign -d --entitlements - --xml "$app" 2>/dev/null || codesign -d --entitlements :- "$app" 2>/dev/null || true)
          if printf '%s' "$ents" | grep -q 'aps-environment'; then has_aps=yes; else has_aps=no; fi
          if printf '%s' "$ents" | grep -q 'com.apple.developer.associated-domains' &&
             [ -n "${invite_host:-}" ] && printf '%s' "$ents" | grep -qF "applinks:$invite_host"; then
            has_ad=yes
          elif printf '%s' "$ents" | grep -q 'com.apple.developer.associated-domains'; then
            has_ad=other
          else
            has_ad=no
          fi
          echo "번들의 설정 plist: $has_plist · 서명의 aps-environment: $has_aps · 서명의 associated-domains(applinks): $has_ad"
          if [ "$fcm" = yes ] && { [ "$has_plist" != yes ] || [ "$has_aps" != yes ]; }; then
            echo "::warning::앱 알림을 켰는데 나온 앱에 빠진 것이 있습니다 (plist=$has_plist · aps=$has_aps) — docs/PUSH.md 문제 해결"
            echo "fcm=partial" >> "$GITHUB_ENV"
          fi
          if [ "${ul:-no}" = yes ] && [ "$has_ad" != yes ]; then
            echo "::warning::초대 링크를 켰는데 나온 앱의 서명에 applinks:<서버 호스트> 가 없습니다 (associated-domains=$has_ad) — docs/DEPLOY.md 11절"
            echo "ul=partial" >> "$GITHUB_ENV"
          fi
          rm -rf "$x"

      - name: TestFlight 에 올리기
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ipa=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios -f "$ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          {
            echo "### TestFlight 에 올렸습니다 — ${{ github.event.inputs.version }} (판 $(git rev-list --count HEAD))"
            echo ""
            echo "App Store Connect → TestFlight 에서 처리(10~30분)가 끝나면 테스터에게 갑니다."
            echo "서명: ${mode} · 프로파일 ${profile_name} · 팀 ${team_id}"
            case "${fcm:-no}" in
              yes)     echo "앱 알림(APNs · FCM): **켜짐** — 프로파일 aps=${profile_aps} · App ID 푸시=${push_cap:-확인 안 함(수동 모드)}" ;;
              partial) echo "앱 알림(APNs · FCM): **확인 필요** — 켰는데 나온 앱에 설정 plist 나 aps 권한이 빠졌습니다(로그의 경고 참고)" ;;
              *)       echo "앱 알림(APNs · FCM): 꺼짐 — ${fcm_why:-설정 없음} · 프로파일 aps=${profile_aps:-없음}. 켜는 법: docs/PUSH.md" ;;
            esac
            echo ""
            case "${ul:-no}" in
              yes)     echo "초대 링크(Universal Links): **켜짐** — 서명에 applinks 권한 · App ID Associated Domains=${ul_cap:-확인 안 함(수동 모드)}" ;;
              partial) echo "초대 링크(Universal Links): **확인 필요** — 켰는데 나온 앱의 서명에 applinks 가 없습니다(로그의 경고 참고)" ;;
              *)       echo "초대 링크(Universal Links): 꺼짐 — ${ul_why:-이유 모름} · 프로파일 associated-domains=${profile_ad:-모름}. 링크는 사파리의 초대 페이지로 열립니다. 켜는 법: docs/DEPLOY.md 11절" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 키체인 정리
        if: always()
        run: |
          [ -n "$KC" ] && security delete-keychain "$KC" || true
          rm -rf ~/private_keys "$RUNNER_TEMP/sign" 2>/dev/null || true
          # 러너는 어차피 버려지지만, 앱 알림 설정 파일도 남기지 않습니다.
          rm -f app/ios/Runner/GoogleService-Info.plist 2>/dev/null || true
