name: mybody
description: "인바디 결과지를 읽어 목표까지의 계획을 세우고, 오차보다 작은 변화를 성과로 세지 않습니다."
publish_to: none
version: 0.2.2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # 도메인 로직은 순수 Dart 로 따로 둡니다 — Flutter 를 안 깔아도
  # `dart test` 로 돌릴 수 있어야 검증이 빨라집니다.
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  http: ^1.6.0
  image_picker: ^1.2.3
  lucide_icons: ^0.257.0
  mybody_core:
    path: ../packages/mybody_core
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    # 한글을 앱에 넣어 둡니다.
    #
    # 안 넣으면 CanvasKit 이 글꼴을 구글 CDN 에서 받으려 하고, 막힌 곳에서는
    # **글자가 통째로 회색 네모로 나옵니다.** 실제로 첫 시험 빌드에서 그걸
    # 봤습니다 — 나중에 발견하면 "왜 한글이 네모지" 가 됩니다.
    #
    # 한 벌에 1.6MB 입니다 (전에 쓰던 것보다 1.2MB 작습니다).
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700

    # **이 이름표가 요청 한 건을 막습니다.**
    #
    # Flutter 웹(CanvasKit)은 앱에 `Roboto` 라는 이름의 글꼴이 없으면
    # **쓰든 안 쓰든** fonts.gstatic.com 에서 Roboto 를 받아 옵니다.
    # 엔진 쪽이 조건 없이 그렇게 돼 있습니다:
    #
    #     if (!loadedRoboto) { _downloadFont('Roboto', _robotoUrl, ...) }
    #
    # 그래서 그 이름표를 우리가 답니다. 알맹이는 Pretendard 에서 라틴만
    # 떼어낸 작은 조각입니다 (`tools/make-latin-fallback.py`).
    # 통째로 또 넣으면 2.8MB 가 두 벌이 되고, 빈 껍데기를 넣으면 글꼴이
    # 안 정해진 글자 자리가 네모가 됩니다 — 받아 오던 Roboto 가 덮어
    # 주던 자리가 거기입니다.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Latin-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Latin-Bold.ttf
          weight: 700
