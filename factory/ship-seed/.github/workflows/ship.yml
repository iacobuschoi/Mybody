# =============================================================================
# ship — 출시. 이 저장소(app-factory-ship)는 공개 · 코드 없음 · 출시 창구입니다.
#
#   gh workflow run ship.yml -f app=habit -f version=1.0.0 [-f rollout=0.2]
#
# 실행하면 store-production 환경에서 멈추고 GitHub 이 주인에게 승인 요청을 보냅니다(폰 GitHub 앱).
# 승인 전에는 프로덕션 열쇠(ASC_PROD_* · PLAY_PROD_SA_JSON)가 어디에도 풀리지 않습니다 — GitHub 이 강제합니다.
# 승인 뒤: 애플 심사 제출(통과 시 자동 출시) · 플레이 프로덕션(단계적 배포).
#
# 무엇을 올리나: app-factory 의 release-candidate 가 queue/<앱>/<판>/ 에 넣어 둔 문안 · 스크린샷 · build.json.
# 공개 저장소라 실행 기록이 보입니다 — 요약에는 앱 · 판 · 결과만 찍습니다.
# ※ 첫 실행에서 확정 — 아직 실제로 돌려 보지 않은 파일입니다.
# =============================================================================
name: ship

on:
  workflow_dispatch:
    inputs:
      app:
        description: 앱 slug
        required: true
      version:
        description: 판 이름 1.2.3 (queue/<앱>/<판> 이 있어야 함)
        required: true
      rollout:
        description: 플레이 단계적 배포 비율 0.05~1 (새 앱은 1)
        required: true
        default: '0.2'
      stores:
        description: both · ios · android
        default: both
        type: choice
        options: [both, ios, android]

concurrency:
  group: ship-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: store-production        # ← 여기서 주인 승인을 기다립니다
    env:
      APP: ${{ inputs.app }}
      VERSION: ${{ inputs.version }}
      Q: queue/${{ inputs.app }}/${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: queue 확인
        shell: bash
        run: |
          [ -f "$Q/build.json" ] || { echo "queue/$APP/$VERSION 이 없습니다 — app-factory 의 release-candidate 를 먼저"; exit 1; }
          jq . "$Q/build.json"
          echo "bid=$(jq -r .bundle_id "$Q/build.json")" >> "$GITHUB_ENV"
          echo "ac=$(jq -r .android_version_code "$Q/build.json")" >> "$GITHUB_ENV"
          echo "ib=$(jq -r .ios_build_number "$Q/build.json")" >> "$GITHUB_ENV"
          echo "### $APP $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: fastlane
        run: sudo gem install fastlane -N -q >/dev/null && fastlane --version | tail -1

      # 애플: 문안 · 스크린샷 · 빌드 지정 · 심사 제출. 통과하면 자동 출시(automatic_release).
      # 사용자가 있는 앱은 단계적 출시(phased_release) 7일.
      - name: 애플 — 심사 제출
        if: inputs.stores != 'android'
        env:
          KEY_ID: ${{ secrets.ASC_PROD_KEY_ID }}
          ISSUER: ${{ secrets.ASC_PROD_ISSUER_ID }}
          P8: ${{ secrets.ASC_PROD_KEY_P8 }}
        shell: bash
        run: |
          [ -n "$KEY_ID" ] && [ -n "$P8" ] || { echo "ASC_PROD_* 시크릿 없음"; exit 1; }
          jq -n --arg k "$KEY_ID" --arg i "$ISSUER" --arg p "$(printf '%s' "$P8" | tr -d '\r')" '{key_id:$k, issuer_id:$i, key:$p, in_house:false}' > "$RUNNER_TEMP/asc.json"
          phased=false; [ "$(jq -r '.phased // false' "$Q/build.json")" = "true" ] && phased=true
          fastlane deliver --api_key_path "$RUNNER_TEMP/asc.json" --app_identifier "$bid" \
            --app_version "$VERSION" --build_number "$ib" --skip_binary_upload \
            --metadata_path "$Q/ios/metadata" --screenshots_path "$Q/ios/screenshots" --overwrite_screenshots \
            --submit_for_review --automatic_release --phased_release "$phased" \
            --precheck_include_in_app_purchases false --force --run_precheck_before_submit false
          echo "- 애플: 심사 제출 (빌드 $ib)" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/asc.json"

      # 구글: 내부 테스트에 이미 있는 같은 versionCode 를 프로덕션으로 + 등록정보 + 단계적 배포.
      - name: 구글 — 프로덕션
        if: inputs.stores != 'ios'
        env:
          SA: ${{ secrets.PLAY_PROD_SA_JSON }}
        shell: bash
        run: |
          [ -n "$SA" ] || { echo "PLAY_PROD_SA_JSON 없음"; exit 1; }
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          r="${{ inputs.rollout }}"; status=inProgress; [ "$r" = "1" ] && status=completed
          fastlane supply --json_key "$RUNNER_TEMP/sa.json" --package_name "$bid" \
            --track internal --track_promote_to production --version_code "$ac" \
            --rollout "$r" --track_promote_release_status "$status" \
            --metadata_path "$Q/android" --skip_upload_aab --skip_upload_apk
          echo "- 구글: 프로덕션 $(echo "$r*100" | bc)% (versionCode $ac)" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/sa.json"
