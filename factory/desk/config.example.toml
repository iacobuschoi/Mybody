# ~/.config/desk/config.toml — 없으면 기본값(desk/config.py). 바꾼 뒤: launchctl kickstart -k gui/$(id -u)/lab.deskd
# ([tts] 는 상태판의 「목소리」 창, [brain] model 은 위쪽 모델 토글에서 바꾸면 여기에 적히고 다시 켜지 않아도 바로 적용됩니다)

owner = ""                        # 인사할 때 부를 이름
idle_minutes = 15                 # 아무 말 없이 이만큼 지나면 화면 끄고 박수 대기 ([표] 아래에 두면 그 표 안의 값이 됨)
camera_off = ["~/.local/bin/hand-mouse off"]   # 화면을 끌 때(deskctl sleep · "화면 꺼" · 조용히 지남 · 손으로 끔) 카메라 쓰는 것 끄기

[audio]
device = ""                       # 입력 장치 이름 일부("Brio"). 비우면 시스템 기본 입력 — install.sh 가 Brio 를 찾으면 채움
samplerate = 16000

[wake]
claps = 2                         # 켜는 박수 수
night_claps = 3                   # 밤에는 3번 (침대 앞 책상 — 기침 · 뒤척임에 켜지지 않게)
night = ["01:00", "07:00"]
clap_when_awake = "none"          # "sleep" 이면 깨어 있을 때 박수 두 번으로 끔

[clap]                            # python -m desk calibrate 로 실제 값을 보고 조정
# rise_db = 18.0                  # 바닥 소음보다 이만큼 커야 (시끄러운 방이면 낮추고, 오작동하면 올림)
# abs_min = 0.02                  # 침대에서 치는 박수가 안 잡히면 0.01
# min_centroid_hz = 1500.0        # 문 두드림에 켜지면 올림(2000~2500)
# max_gap_s = 0.8                 # 박수 사이 최대 간격

[listen]
end_silence_s = 0.8               # 말이 끝났다고 보는 침묵
min_utt_s = 0.4
max_utt_s = 20.0
vad_level = -1                    # webrtcvad 0~3(높을수록 엄격). -1 = 끔 — 침대에서 Brio 로 한 말을 거의 못 알아봄
energy_db = 6.0                   # 말소리 대역(150~4000Hz)이 바닥 소음보다 이만큼 커야 말. 못 들으면 낮추고(4), 헛들으면 올림(8)

[stt]
model = "mlx-community/whisper-large-v3-turbo"   # 느리면 "mlx-community/whisper-small-mlx"
language = "ko"
prompt = "앱 공장, 상황판, 브리핑, 클로드, 깃허브, 맥 미니, 아이폰, 안드로이드, 워크플로, 출시"

[tts]
engine = "supertonic"             # 신경망 목소리(맥 안에서, 무료). "say" 면 맥 기본 음성 — 모델을 못 쓰면 알아서 say
style = "F1"                      # Supertonic 목소리: F1~F5(여) · M1~M5(남)
speed = 1.05                      # 빠르게 1.2 · 느리게 0.9
steps = 5                         # 합성 단계 — 높이면(8) 조금 더 매끈하고 느림
pitch = 0                         # 음높이(반음, -6~6). Supertonic 에 없어 틀기 직전에 바꿈 — say 에는 안 먹음
volume = 1.0                      # 이 목소리만의 크기(0~1.5, say 는 1 까지) — 시스템 음량과 별개
voice = "Yuna"                    # say 목소리(설정 → 손쉬운 사용 → 읽기 및 말하기 → 시스템 음성에서 "Yuna (프리미엄)" 권장)
rate = 190                        # say 빠르기
device = ""                       # 소리 낼 장치. TV 가 꺼져도 들리게 맥 미니 내장 스피커로 — install.sh 가 채움

[brain]
workdir = "~/lab/desk-assistant"
model = ""                        # 비우면 Claude Code 기본(Opus 5.5). 상태판 위쪽 토글 · "빠른 모드" · deskctl model 로 바꾸면 여기에 적힘
                                  # "claude-opus-5-5" 정확 · "claude-sonnet-5" 빠름 · "claude-haiku-4-5-20251001" 가장 빠름
timeout_s = 180

[briefing]
city = "Seoul"
repo = ""                         # "<주인>/app-factory"
ship_repo = ""                    # "<주인>/app-factory-ship"

[dashboard]
port = 7070
open_cmd = ""                     # 비우면 크롬 앱 창 전체 화면. 예: "open -a Safari {url}"

[face]                            # 박수로 깨울 때 얼굴 인증 — 등록: deskctl enroll (등록 전엔 박수만으로 켜짐)
enabled = true                    # false 면 예전처럼 박수만으로
camera = "Brio"                   # 카메라 이름 일부. 아이폰 연속성 카메라 말고 이것
name = ""                         # 환영 인사에 부를 이름 (비우면 owner). 예: "최민종"
prompt = "얼굴 인증해 주세요."
welcome = "{name}님, 환영합니다."
fail = "얼굴을 확인하지 못했어요."
on_error = "stay"                 # 카메라 · 인식이 고장일 때: "stay" 안 켬(키보드 · deskctl wake 로는 켜짐) · "wake" 얼굴 없이 켬
threshold = 0.40                  # 주인인데 자꾸 실패하면 0.36, 남이 통과하면 0.45

[bargein]                         # 끼어들기 — 비서가 말하는 도중 멈춤 말을 하면 말하기 · 그 차례의 남은 답 · 밀린 말을 모두 버림. 다른 말로는 안 끊김
enabled = true                    # false 면 말하는 동안 아무것도 안 들음(예전처럼)
stop_words = ["잠깐", "멈춰", "그만", "스톱", "스탑"]
margin_db = 3.0                   # 민감도: 스피커 되먹임보다 이만큼 커야 받아써 봄. 멈춤 말을 못 들으면 낮추고(0), 헛멈추면 올림(6)
# min_s = 0.12                    # 0.3초 안에 그 소리가 이만큼 있어야
# grace_s = 0.3                   # 말 시작 뒤 이 시간은 되먹임 크기만 배움
